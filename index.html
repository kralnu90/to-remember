<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one phone-width column; clocks pinned on top, the room or fight in the middle, the party and actions below. */
:root{
  color-scheme: dark;
  --ink:#16141d;        /* night-blue page */
  --slate:#211e2b;      /* panels */
  --line:#3a3547;       /* hairlines */
  --parch:#ece3cc;      /* text */
  --dim:#a79f8d;        /* secondary text */
  --brass:#e0ae52;      /* time, the accent */
  --present:#c9925c;    /* Present era: warm stone */
  --future:#86ad6f;     /* Future era: moss */
  --good:#8fc77a;
  --bad:#e07a66;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  --mono:"Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.btn{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px;text-align:left}
.btn:hover{border-color:var(--brass)}
.btn[disabled]{opacity:.38;cursor:not-allowed;border-color:var(--line)}
.btn.primary{background:var(--brass);color:#1d1606;border-color:var(--brass);font-weight:700;text-align:center}
.btn.ghost{background:transparent}
.cost{font-family:var(--mono);font-size:12px;color:var(--brass);white-space:nowrap}

/* clocks */
.clocks{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--ink);padding-block:10px 8px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.clock .val{font-family:var(--mono);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.clock.left .val{color:var(--brass)}
.clock.left.low .val{color:var(--bad)}
.clock.surv{text-align:right}
.bar{height:6px;background:var(--slate);border-radius:3px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--parch);width:0}
.delta{font-family:var(--mono);font-size:13px;margin-left:6px;transition:opacity .6s}
.delta.neg{color:var(--bad)} .delta.pos{color:var(--good)}

/* room */
.room{display:grid;gap:10px}
.roomhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.era{font-size:12px;text-transform:uppercase;letter-spacing:.14em;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.era.present{color:var(--present)} .era.future{color:var(--future)} .era.past{color:#d8b878}
.desc{color:var(--dim);margin:0}
.square{display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:64px minmax(130px,auto) 64px;gap:6px;max-width:360px;width:100%;margin:4px auto 0}
.cell{display:flex;align-items:center;justify-content:center}
.floor{grid-column:2;grid-row:2;border:2px solid var(--line);border-radius:6px;padding:12px;text-align:center;flex-direction:column;gap:6px;
  background:repeating-linear-gradient(45deg, transparent 0 12px, rgba(255,255,255,.02) 12px 24px), var(--slate)}
.floor.present{border-color:color-mix(in srgb, var(--present) 55%, var(--line))}
.floor.future{border-color:color-mix(in srgb, var(--future) 55%, var(--line))}
.door{width:58px;height:58px;border-radius:29px 29px 6px 6px;border:2px solid var(--brass);background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0}
.door b{font-family:var(--display);font-size:26px;line-height:1;color:var(--brass)}
.door .cost{font-size:10px}
.door.came{border-style:dashed;border-color:var(--line);cursor:default}
.door.came b{color:var(--line);font-size:14px}
.chamber{position:relative;max-width:420px;width:100%;margin:2px auto 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#141218}
.chamber canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.rdoor{position:absolute;background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;border-radius:6px}
.rdoor.s{justify-content:flex-start}
.rdoor.w{align-items:flex-start}.rdoor.e{align-items:flex-end}
.rlbl{font:700 10px var(--body);background:#efe4c6;color:#2b2116;border:2px solid #5a4632;padding:1px 5px;box-shadow:2px 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.rlbl.echo{background:#16141d;color:var(--echo,#8fd3d0);border-color:var(--echo,#8fd3d0)}
.rdoor:hover .rlbl,.rdoor:focus-visible .rlbl{background:#f6d78f;border-color:var(--brass)}
.rdoor:hover .rlbl.echo,.rdoor:focus-visible .rlbl.echo{background:#24202e}
.rdoor:focus-visible{outline:2px solid var(--brass);outline-offset:0}
.chint{text-align:center}
.n{grid-column:2;grid-row:1}.s{grid-column:2;grid-row:3}.w{grid-column:1;grid-row:2}.e{grid-column:3;grid-row:2}
.note{border-left:3px solid var(--brass);padding:8px 12px;background:var(--slate);border-radius:0 8px 8px 0}

/* fight */
.battle{display:block;width:100%;max-width:100%;aspect-ratio:16/9;height:auto;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);background:#16141d;cursor:pointer}
.tmap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#3f6a35;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tmap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.tplace{position:absolute;background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;line-height:1.2;border-radius:6px}
.tplace .tlbl{font:700 11px var(--body);background:rgba(20,16,30,.82);color:#f0dfb0;border:1px solid rgba(224,174,82,.6);border-radius:10px;padding:2px 8px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none}
.tplace:hover .tlbl,.tplace:focus-visible .tlbl,.tmap.names .tlbl{opacity:1;transform:none}
.tround{position:absolute;width:clamp(42px,12.5%,56px);aspect-ratio:1;border-radius:50%;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,rgba(58,46,78,.92),rgba(18,14,28,.92));border:2px solid var(--brass);color:#f3dca0;
  box-shadow:0 0 0 2px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.5),inset 0 0 8px rgba(224,174,82,.25);transform:translate(-50%,-50%)}
.tround svg{width:56%;height:56%;display:block}
.tround .tcap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font:700 9px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#f0dfb0;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000}
.tround:active{transform:translate(-50%,-50%) scale(.93)}
.tround:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tround.go{border-color:#c98cff;color:#f2dcff;background:radial-gradient(circle at 50% 35%,rgba(110,50,170,.95),rgba(30,12,50,.95));box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 14px rgba(190,110,255,.6),inset 0 0 10px rgba(220,160,255,.35);animation:tgo 2.4s ease-in-out infinite}
@keyframes tgo{50%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 22px rgba(190,110,255,.85),inset 0 0 12px rgba(220,160,255,.5)}}
@media (prefers-reduced-motion:reduce){.tround.go{animation:none}}
.tround .tbadge{top:-4px;right:-4px;border-radius:9px}
.tour{position:absolute;inset:0;z-index:5}
.tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 2px var(--brass),0 0 18px 4px rgba(224,174,82,.55),0 0 0 9999px rgba(8,6,14,.66);pointer-events:none;transition:all .25s ease}
.tour .spot.round{border-radius:50%}.tour .spot.none{box-shadow:0 0 0 9999px rgba(8,6,14,.55)}
.tour .tip{position:absolute;left:7%;right:7%;background:rgba(24,19,34,.97);border:1px solid var(--brass);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.6);display:grid;gap:8px}
.tour .tip h3{margin:0;font:700 16px var(--body);color:var(--brass)}.tour .tip p{margin:0;font-size:14px;line-height:1.4}
.tour .tip .tnav{display:flex;align-items:center;gap:8px}.tour .tip .tnav .small{flex:1}
.tour .tip .btn{min-height:36px;padding:6px 14px;width:auto}
@media (prefers-reduced-motion:reduce){.tour .spot{transition:none}}
.pmem{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.pmem img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#3c486e;border:2px solid var(--line)}
.pmem .pn{font-weight:700}.pmem .ps{font:12px var(--mono);color:var(--muted,#a9a3b8);margin-top:2px}
.pmem .xpbar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}.pmem .xpbar i{display:block;height:100%;background:var(--brass)}
.tplace:focus-visible{outline:2px solid var(--brass);outline-offset:0}
.tbadge{position:absolute;top:0;right:4%;min-width:18px;height:18px;padding:0 4px;background:var(--brass);color:#1d1606;border:2px solid #2b2116;font:700 11px var(--mono);display:flex;align-items:center;justify-content:center}
.menu{display:grid;gap:12px;padding-top:8px}
.menuhead{display:grid;gap:12px}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:360px){.menugrid{grid-template-columns:1fr}}
.btn.mb{display:grid;gap:2px;text-decoration:none;align-content:center}
a.btn{color:inherit}
.btn.mb b{font-weight:700}
.btn.mb span{font-size:13px;color:var(--dim);font-weight:400}
.btn.primary.mb span{color:#3a2c0e}
.stars{display:flex;gap:6px}
.star{font-size:30px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}
.star.on{color:var(--brass)}
.field textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit;min-height:84px;width:100%;resize:vertical}
body.big .wrap{zoom:1.12}
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;text-align:left;min-width:0}
.card .nm{font-weight:700;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--dim)}
.hp{height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.hp > i{display:block;height:100%;background:var(--bad)}
.party .hp > i{background:var(--good)}
.card.dead{opacity:.35}
.card.target{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb, var(--brass) 35%, transparent)}
.card.active{border-color:var(--parch)}
.card.elite .nm{color:var(--brass)}
.card.nemesis .nm{color:#ff5a6e;text-shadow:0 0 6px rgba(255,90,110,.45)}
.card .traits{font-size:11px;color:var(--muted,#a79f8d);display:block;margin-top:2px}
.party{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.party .card.down{opacity:.45}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--brass)}
.rollrow{display:block}
.actions .btn .si{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.log{font-size:14px;color:var(--dim);display:grid;gap:2px;max-height:132px;overflow:auto;min-width:0}
.log div:first-child{color:var(--parch)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.turnline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

/* overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,9,14,.78);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet > div{background:var(--slate);border:1px solid var(--line);border-radius:14px;width:100%;max-width:540px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.ledger .total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px}
.stats span:nth-child(even){font-family:var(--mono);text-align:right}

/* setup */
.title{font-family:var(--display);font-size:44px;line-height:1.02}
.title .x{color:var(--brass)}
.field{display:grid;gap:6px}
.field input{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit;min-height:44px;width:100%}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;text-align:center}
.seg .btn.on,.pick.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 14%, var(--slate))}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{display:grid;gap:2px;text-align:left}
.tune{display:grid;gap:14px}
.tune fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin:0}
.tune legend{padding:0 6px;color:var(--brass);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.tune label{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;font-size:15px}
.tune input{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--parch);font-family:var(--mono);width:100%;min-height:40px}
.credit{font-size:13px;color:var(--dim);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* town, gear, loot */
.r-common{color:#d8d0bd}.r-uncommon{color:#93cf7e}.r-rare{color:#7fb0e8}.r-epic{color:#c09bef}.r-legendary{color:#f0a040;text-shadow:0 0 6px rgba(240,160,64,.4)}.st.uq{color:#f0c27a;font-style:italic}
.ending .desc{font-size:15px;line-height:1.55}.credits{margin:14px 0;text-align:center;padding:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.smithrow{display:grid;gap:6px;margin-top:6px}.smithrow .btn{display:flex;justify-content:space-between}
.rlbl.boss{background:#2a2008;color:#f0c27a;border-color:#e0ae52;box-shadow:0 0 8px rgba(224,174,82,.5)}
.sb{color:var(--brass);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;background:var(--ink);text-align:left;min-width:0}
.item.soul{border-color:var(--brass);box-shadow:0 0 10px color-mix(in srgb, var(--brass) 30%, transparent)}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .st{font-family:var(--mono);font-size:12px;color:var(--dim)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:grid;gap:2px;text-align:left;min-width:0}
.slot .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.slot.sel{border-color:var(--parch)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs .btn{flex:none;min-height:40px;padding:6px 12px}
.tabs .btn.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 14%, var(--slate))}
.up{color:var(--good)}.down{color:var(--bad)}
.wizard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--slate);display:grid;gap:4px}
.wizard q{font-style:italic;quotes:"“" "”"}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster .card.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 12%, var(--slate))}
.stranger .nm{font-style:italic}
.clover{color:#7fd060;letter-spacing:1px}.clover i{color:var(--line);font-style:normal}
.unworthy{color:#ff5a6e;font-weight:700}
.rlbl.nem{background:#2a0e14;color:#ff5a6e;border-color:#ff5a6e}
.rdoor:hover .rlbl.nem,.rdoor:focus-visible .rlbl.nem{background:#3a1420}
.flavour{font-size:12px;color:var(--brass);font-style:italic}
.tavern{display:grid;gap:8px}
.recruit{display:flex;justify-content:space-between;align-items:center;gap:10px}
.door.echo{border-color:var(--echo, #8fd3d0);width:58px}
.door.echo b{font-size:11px;font-family:var(--body);font-weight:700;color:var(--echo, #8fd3d0);line-height:1.1;text-align:center}
.namefade{display:grid;justify-items:center;gap:6px;padding:12px 0}
.namefade .old{font-family:var(--display);font-size:28px;color:var(--dim);animation:fadeout 2.2s forwards}
.namefade .new{font-family:var(--display);font-size:36px;color:var(--brass);opacity:0;animation:fadein 1.6s 1.4s forwards}
@keyframes fadeout{0%{opacity:1}60%{opacity:1}100%{opacity:.15;text-decoration:line-through}}
@keyframes fadein{to{opacity:1}}
.events{display:grid;gap:8px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;min-width:0}
.inline .btn{flex:none}
.small{font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion: reduce){.namefade .new{opacity:1}}
.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0}
.map svg{width:100%;height:auto;display:block}
.map [data-place]{cursor:pointer;outline:none}
.map .lbl rect{fill:#efe4c6;stroke:#5a4632;stroke-width:1}
.map .lbl text{font:700 11px var(--body);fill:#2b2116}
.map [data-place]:hover .lbl rect,.map [data-place]:focus-visible .lbl rect{fill:#f6d78f;stroke:#e0ae52;stroke-width:2}
.map .badge circle{fill:#e0ae52;stroke:#2b2116;stroke-width:1.5}.map .badge text{font:700 11px var(--mono);fill:#1d1606}
.riftglow{animation:rift 3s ease-in-out infinite;transform-origin:190px 56px}
@keyframes rift{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.towerglow{animation:tglow 2.4s ease-in-out infinite}@keyframes tglow{50%{opacity:.4}}
.flame{animation:flick .6s ease-in-out infinite alternate;transform-origin:190px 382px}@keyframes flick{to{transform:scaleY(1.15) scaleX(.92)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
@media (prefers-reduced-motion: reduce){.riftglow,.towerglow,.flame{animation:none}}
.intro{position:fixed;inset:0;z-index:30;background:#07060a;border:0;display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer}
.intro span{font-family:var(--display);font-size:24px;color:var(--parch);font-style:italic;opacity:0;animation:fadein 1.4s .3s forwards;text-align:center}
.wizard q{display:block}
.dlg{grid-template-columns:96px 1fr;align-items:start;column-gap:12px}
.dlg-body{display:grid;gap:4px;min-width:0}
.pt{position:relative;width:96px;height:96px;border-radius:8px;background:#3c486e;border:2px solid var(--line);overflow:hidden}
.pt img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pt .talk{opacity:0;animation:ptTalk .3s step-end 7}
.pt.photo img{image-rendering:auto;transform-origin:50% 100%;animation:ptBob .32s step-end 6}
@keyframes ptBob{0%{transform:translateY(-2%) scale(1.02)}50%{transform:none}}
@keyframes ptTalk{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pt .talk,.pt.photo img{animation:none}}
</style>

<body>

<div id="sheet" class="sheet" hidden></div>

<script>
/* ======================= helpers ======================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const roll=(n,s)=>{let t=0;for(let i=0;i<n;i++)t+=rnd(1,s);return t};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')};
const secs=s=>(Math.round(s*10)/10).toString().replace(/\.0$/,'')+'s';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
const tickets=list=>{let t=Math.random()*list.reduce((a,b)=>a+b[1],0);for(const x of list){if((t-=x[1])<0)return x[0]}return list[list.length-1][0]};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ======================= tuning ======================= */
const TUNE=[
 ['Run',[['startTime','Starting time left (seconds)',300],['target','Survival target (seconds)',1800]]],
 ['Basic action costs (seconds)',[['cAttack','Attack',3],['cSpell','Time Bolt',7],['cHeal','Rewind wounds',5],['cItem','Use an item',2],['cDefend','Defend',2],['cMove','Move to the next room',10]]],
 ['Time drops (seconds)',[['dRegMin','Regular enemy, lowest',13],['dRegMax','Regular enemy, highest',19],['dEliteMin','Elite, lowest',55],['dEliteMax','Elite, highest',80],['dBossMin','Mini-boss, lowest',100],['dBossMax','Mini-boss, highest',140],['dTreasMin','Treasure room, lowest',30],['dTreasMax','Treasure room, highest',50]]],
 ['Bigger party guard (damage taken, %)',[['g3','Party of three',90],['g4','Party of four',85]]],
 ['Smaller party bonus (multiplier)',[['b1','Solo',1.25],['b2','Two',1.12],['b3','Three',1.05],['b4','Four',1]]],
 ['Loot (%)',[['soulbound','Soulbound chance per drop',12],['dropReg','Item drop chance per regular enemy',20],['dropTreasure','Item chance in treasure rooms',40],['crystalReg','Crystal chance per fight',15]]],
 ['Companions',[['returnBase','Fallen return chance, base (%)',40],['returnPerLoop','Extra return chance per loop together (%)',10],['echoChance','Distant Echo chance per room (%)',30],['nemChance','Nemesis door chance per room, once ready (%)',35]]],
 ['Combat',[['critBase','Base crit chance (%)',5],['critDmg','Base crit damage (%)',150],['lvlDmg','Damage per character level (%)',10],['lvlArm','Armour per character level',3],['armK','Armour curve, base',30],['armLvl','Armour curve, per level',10],['defendCut','Damage cut while defending (%)',50]]],
 ['Enemies (%)',[['hpMult','Base life (%)',85],['dmgMult','Base damage (%)',105],['soloLife','Life when you go solo (%)',90],['hpScale','Life growth per minute survived',3.5],['lvlScale','Life growth per party level',16],['dmgScale','Damage growth per minute survived',3.5],['dmgLvl','Damage growth per party level',14],['armScale','Armour growth per minute survived',4]]]
];
const DEFAULTS={};TUNE.forEach(g=>g[1].forEach(([k,,v])=>DEFAULTS[k]=v));
let CFG=Object.assign({},DEFAULTS,store.get('t2r-tune2')||{});

/* ======================= classes ======================= */
// speed: 1 slow, 2 medium, 3 fast. tempo: % off the time cost of this character's actions (negative = slower: Rogue stalks, Cleric concentrates).
// dmg: weapon damage range. arm: armour (cuts damage taken, see armCut). dodge: % chance to avoid a hit.
const CLASSES={
 hero:{cls:'Fixed Point',hp:34,dmg:[4,9],arm:24,dodge:0,speed:2,tempo:5,grow:5,skills:[{key:'bolt',name:'Time Bolt',lvl:1},{key:'rewind',name:'Rewind wounds',lvl:1}]},
 warrior:{cls:'Warrior',hp:40,dmg:[5,10],arm:40,dodge:0,speed:1,tempo:0,grow:6,skills:[{key:'taunt',name:'Taunt',lvl:5}],blurb:'Tank'},
 paladin:{cls:'Paladin',hp:36,dmg:[4,9],arm:40,dodge:0,speed:1,tempo:0,grow:5,skills:[{key:'smite',name:'Smite',lvl:5}],blurb:'Tank, some healing'},
 cleric:{cls:'Cleric',hp:28,dmg:[3,6],arm:24,dodge:0,speed:2,tempo:-20,grow:4,skills:[{key:'holy',name:'Holy Light',lvl:1},{key:'mend',name:'Mend',lvl:1},{key:'qheal',name:'Quick Prayer',lvl:1},{key:'lily',name:'Lily Mend',lvl:3},{key:'misery',name:'Misery',lvl:5}],blurb:'Healer, Lily gauge'},
 rogue:{cls:'Rogue',hp:24,dmg:[4,9],arm:16,dodge:12,speed:3,tempo:-10,grow:3,skills:[{key:'backstab',name:'Backstab',lvl:5}],blurb:'Big single hits'},
 ranger:{cls:'Ranger',hp:30,dmg:[4,9],arm:24,dodge:8,speed:3,tempo:5,grow:4,skills:[{key:'volley',name:'Volley',lvl:5}],blurb:'Hits several enemies'},
 mage:{cls:'Mage',hp:24,dmg:[4,8],arm:14,dodge:0,speed:2,tempo:0,grow:3,skills:[{key:'firebolt',name:'Firebolt',lvl:5}],blurb:'Area magic'},
 monk:{cls:'Monk',hp:28,dmg:[3,8],arm:24,dodge:6,speed:3,tempo:0,grow:4,twice:true,skills:[{key:'flurry',name:'Flurry',lvl:5}],blurb:'Hits twice'},
 bard:{cls:'Bard',hp:28,dmg:[4,7],arm:20,dodge:4,speed:2,tempo:15,grow:3,skills:[{key:'inspire',name:'Inspire',lvl:5}],blurb:'Support, time tricks'}
};
const COMP_KEYS=Object.keys(CLASSES).filter(k=>k!=='hero');
// cost: a tuning key or a fixed number of seconds. heal: counts as a heal for Patient gear.
const ACTIONS={
 attack:{cost:'cAttack',target:'enemy',label:'Attack'},defend:{cost:'cDefend',target:'none',label:'Defend'},
 bolt:{cost:'cSpell',target:'enemy'},rewind:{cost:'cHeal',target:'ally',heal:true},
 taunt:{cost:3,target:'none'},smite:{cost:8,target:'enemy'},mend:{cost:6,target:'ally',heal:true},holy:{cost:5,target:'enemy'},lily:{cost:1,target:'ally',heal:true},qheal:{cost:1,target:'ally',heal:true,flat:true},misery:{cost:4,target:'none'},backstab:{cost:5,target:'enemy'},
 volley:{cost:6,target:'none'},firebolt:{cost:8,target:'none'},flurry:{cost:4,target:'enemy'},inspire:{cost:3,target:'ally'},
 slow:{cost:3,target:'enemy'},rturn:{cost:4,target:'none'},potion:{cost:'cItem',target:'ally'},stopwatch:{cost:0,target:'none'},smoke:{cost:'cItem',target:'none'},phoenix:{cost:'cItem',target:'downed'},sacrifice:{cost:0,target:'sacrifice'}
};
// what each skill does, shown under its button
const SKILL_INFO={slow:'Next enemy hit −50%',rturn:'Undo the last enemy round',stopwatch:'Next action is free',smoke:'Escape, no rewards',attack:'100% weapon dmg',bolt:'280% weapon dmg',rewind:'Heal over 3 rounds',taunt:'All enemies hit you',smite:'200% dmg, heals self',
 mend:'Big heal',holy:'160% dmg, grows a Lily',lily:'Heal, uses a Lily',misery:'300% dmg to all foes',backstab:'240% dmg, +30% crit',volley:'175% dmg to 3 foes',firebolt:'225% dmg to all foes',qheal:'Heal 10% life, 6-round cooldown',flurry:'3 hits of 75%',
 inspire:'+40% dmg, +15% crit',defend:'Take 50% less'};
const COLOURS=['#8fd3d0','#e39ac7','#a9c4ff','#f0c27a','#b5e08a','#d7a6ff','#ff9f8a','#9fe6b8'];

/* ======================= names ======================= */
const N_START=['Al','Bran','Cor','Ed','Fen','Mar','Tor','Wyn','Is','Hal','Rho','Sab','Or','Lis','Gar','Ev','Ka','Bel','Thal','Mira','Od','Ser','Yl','Dar'];
const N_MID=['','','a','e','ri','ven','o','la','an'];
const N_END=['ith','dric','a','wen','mund','elle','os','ric','yn','ora','is','ard','ette','iel','on','ka'];
const SURNAMES=['Ashworth','Thornby','Millward','Brightwater','Hollowell','Crane','Fairweather','Underhill','Coldbrook','Stillwater','Marsh','Hartley','Greaves','Fletcher','Oakhart','Ravensby','Tallow','Wickham','Bellmoor','Hearth','Quill','Larkspur','the Grey','of the Mill'];
const randFirst=()=>{let n=pick(N_START)+pick(N_MID)+pick(N_END);return n.charAt(0).toUpperCase()+n.slice(1)};
const randSur=()=>pick(SURNAMES);
const randName=()=>randFirst()+' '+randSur();

/* ======================= world ======================= */
// arm: armour (armoured foes shrug off weak hits, so use big skills). dodge: % chance to avoid a hit.
// The bestiary (v1 catalogue). Each creature is a profile against the Bonewalker (life, damage, armour multipliers),
// then scaleFoe grows it with time survived and party level. era 'past' = Distant Echo rooms and chapels.
const FOE_BASE={hp:18,dmg:[3,7],arm:10};
const SPD_DODGE={fast:12,normal:5,slow:0};
// [name, family, era, from loop, life, damage, armour, speed, ability, eliteOnly]
const BESTIARY=[
 ['Time-Torn Hound','beast','present',1,.95,.9,.5,'fast',''],
 ['Thornback Boar','beast','present',1,1.35,1.2,1.15,'slow','charge'],
 ['Ashen Spider','beast','present',1,1.0,.85,.85,'normal','poison'],
 ['Emberling','arcane','present',2,.95,1.2,.65,'normal','burn'],
 ['Spell Leech','arcane','present',4,1.05,1.0,.5,'fast','siphon'],
 ['Bonewalker','undead','past',1,1.0,1.0,1.0,'slow',''],
 ['Hollow Revenant','undead','past',3,1.8,1.45,1.5,'slow','rise'],
 ['Wailing Soul','undead','past',3,.85,1.5,.15,'fast','fear'],
 ['Chrono Mite','temporal','future',1,.65,.85,.35,'fast','thief'],
 ['Echo Stalker','temporal','future',4,1.2,1.45,.85,'fast','echo'],
 ['Loop Wraith','temporal','future',6,1.45,1.3,1.15,'normal','wraith'],
 ['Time Devourer','temporal','future',8,3.1,2.0,2.0,'slow','feast',1],
 ['Clockwork Rat','construct','future',1,.7,.85,.5,'fast','pack'],
 ['Shard Golem','construct','future',7,2.3,1.5,2.2,'slow','mirror'],
 ['Gloomling','abyssal','future',12,1.1,1.35,.65,'fast','shroud'],
 ['Nightmare Hound','abyssal','future',15,1.6,1.95,1.0,'fast','frenzy']
];
// scaleFoe already grows enemies with party level, so the draft's late-game profiles are pulled halfway back towards 1 to avoid double scaling
const soften=x=>x>1?1+(x-1)*.5:x;
const CREATURES=BESTIARY.map(([name,fam,era,from,l,d,a,spd,ab,eliteOnly])=>({name,fam,era,from,ab,eliteOnly:!!eliteOnly,
  hp:Math.round(FOE_BASE.hp*soften(l)),dmg:FOE_BASE.dmg.map(v=>Math.max(1,Math.round(v*soften(d)))),arm:Math.round(FOE_BASE.arm*soften(a)),dodge:SPD_DODGE[spd],
  xp:Math.round(7*(l+d)/2+(SPD_DODGE[spd]?1:0))}));
const FOE_BY_NAME=Object.fromEntries(CREATURES.map(c=>[c.name,c]));
const FOES={present:CREATURES.filter(c=>c.era==='present'),future:CREATURES.filter(c=>c.era==='future'),past:CREATURES.filter(c=>c.era==='past')};
const AB_SHORT={charge:'Charges',poison:'Poison',burn:'Burn',siphon:'Siphon',rise:'Rises once',fear:'Fear',thief:'Time thief',echo:'Echo',wraith:'Remembers',feast:'Feasts on time',pack:'Pack',mirror:'Mirror',shroud:'Shroud',frenzy:'Frenzy'};
const ABILITY_INFO={charge:'Winds up, then charges for double damage',poison:'Poisons: lose life each round',burn:'Burns: lose life each round',
 siphon:'Strips a buff or a Lily',rise:'Rises once, unless Time Bolt finishes it',fear:'Fear: your next action costs 2s more',thief:'Each hit steals 1s',
 echo:'Repeats its last attack at half strength',wraith:'Remembers who it killed',feast:'Eats your time reward every round it lives',pack:'Hunts in packs',
 mirror:'Reflects 25% of Time Bolt damage',shroud:'Hides in darkness, then ambushes',frenzy:'Attacks twice every other round'};
// who you can meet right now: unlocked by loop
function poolFor(era,loop,elite){return FOES[era].filter(c=>(loop||1)>=c.from&&(elite||!c.eliteOnly))}
/* ranks and modifiers: Elite (1 modifier), Champion (2), Dread (3). Nemesis is earned through Enemy Memory, not rolled. */
const RANKS={elite:{name:'Elite',hp:2,dmg:1.25,arm:1.2,mods:1,xp:2,shard:1},champion:{name:'Champion',hp:3,dmg:1.5,arm:1.35,mods:2,xp:3,shard:1.3},
 dread:{name:'Dread',hp:4,dmg:1.65,arm:1.5,mods:3,xp:4,shard:1.6},nemesis:{name:'Nemesis',hp:2.4,dmg:1.35,arm:1.25,mods:1,xp:3,shard:1.5}};
const MODS={brutal:['Brutal','+30% damage'],executioner:['Executioner','+40% damage against targets below 30% life'],volatile:['Volatile','Explodes on death'],
 bloodthirsty:['Bloodthirsty','Heals 25% of the damage it deals'],armoured:['Armoured','+50% armour'],regenerating:['Regenerating','Heals 6% each round'],
 reflective:['Reflective','Returns 15% of the damage it takes'],timewarped:['Time-Warped','Sometimes takes an extra turn'],echoing:['Echoing','Repeats its last attack at half strength'],
 chronolocked:['Chrono-Locked','Immune to Slow and Rewind Turn']};
function rollRank(loop){const r=Math.random();if(loop>=10&&r<.15)return 'dread';if(loop>=5&&r<.4)return 'champion';return 'elite'}
function rankUp(f,rank){const R=RANKS[rank];f.rank=rank;f.maxHp=Math.round(f.maxHp*R.hp);f.hp=f.maxHp;f.dmg=f.dmg.map(v=>Math.max(1,Math.round(v*R.dmg)));f.arm=Math.round(f.arm*R.arm);f.xp=Math.round(f.xp*R.xp);
  const keys=Object.keys(MODS).filter(k=>!(k==='echoing'&&f.ab==='echo')).sort(()=>Math.random()-.5).slice(0,R.mods);f.mods=keys;
  if(keys.includes('armoured'))f.arm=Math.round(Math.max(f.arm,6)*1.5)}
const hasMod=(f,k)=>!!(f.mods&&f.mods.includes(k));
const ELITES={present:FOE_BY_NAME['Thornback Boar'],future:FOE_BY_NAME['Clockwork Rat']}; // old saves only
const BOSSES=[{at:600,name:'The Belltower Revenant',era:'present',hp:136,dmg:[5,15],arm:30,dodge:0,xp:120,attacks:2,room:'The Belltower'},
              {at:1200,name:'The Verdant Matriarch',era:'future',hp:176,dmg:[6,16],arm:20,dodge:0,xp:160,attacks:2,room:'The Heart of the Grove'}];
/* ======================= milestone bosses (since 0.8.0) ======================= */
// One per milestone loop, in order. From its loop on, once you've survived 20 minutes, a gold "door that shouldn't be
// there" appears. You must beat each one to move on: until you do, the next boss stays away and creatures from more
// than four loops past it can't appear (poolLoop). Each drops a Legendary piece that binds to the hero.
// hp/dmg/arm are multipliers of FOE_BASE before scaleFoe grows them with time and level (CFG.msHp/msDmg tune all four).
const MILESTONES=[
 {loop:5,key:'king',name:'The Forgotten King',era:'past',past:1,room:'The Hall That Was',desc:'Banners of a kingdom no one remembers. A throne of cold stone. Someone is still sitting on it.',
  hp:7,dmg:1.7,arm:3,xp:200,legend:'signet',
  talk:['Kneel. You stand in the presence of the King.','My kingdom has not fallen. It is merely... waiting. As am I.']},
 {loop:10,key:'sovereign',name:'The Clockwork Sovereign',era:'present',room:'The Regulator',desc:'Gears the size of cartwheels turn in the dark. Every tick is perfectly, terribly on time.',
  hp:13.5,dmg:2,arm:4.2,xp:320,legend:'cog',
  talk:['TIME IS ORDER. YOU ARE DISORDER.','CORRECTION WILL NOW BEGIN.']},
 {loop:15,key:'maw',name:'The Maw Beneath',era:'present',room:'Beneath the Foundations',desc:'The floor is soft. Warm. It breathes. Somewhere below, something very old is hungry.',
  hp:13,dmg:1.6,arm:3,xp:420,legend:'heart',
  talk:['*The ground opens. It does not speak. It only hungers.*']},
 {loop:20,key:'regent',name:'The Paradox Regent',era:'future',room:'The Throne Between Times',desc:'The throne is old, new and broken all at once. So is the one who sits on it.',
  hp:17,dmg:2.25,arm:3.75,xp:520,legend:'crown',
  talk:['I was, I am, I will be. You are only now.','Let us see which of me you can kill.']},
 {after:'regent',key:'champion',name:'The Hollow Champion',era:'past',echo:1,portrait:'champion',room:'The Day You Died',desc:'The echo of a morning you never lived to see. Someone wearing your face is already standing here.',
  hp:1.75,dmg:.95,arm:1,xp:620,legend:'soul',
  talk:['So you\'re the one who lived. I was supposed to be you.','Every loop you stole was mine. I\'ll take them back, one by one.']},
 {after:'champion',key:'rememberer',name:'The Last Rememberer',era:'past',echo:1,portrait:'rememberer',room:'The Final Echo',desc:'Every loop you have lived, stacked on top of each other like pages. At the centre, an old man in a familiar hat.',
  hp:10,dmg:1.3,arm:3.8,xp:800,legend:'memory',
  talk:['I remember all of it. Every loop. Every name on that stone.','Why keep trying? I stopped. It was so much quieter.']}];
const MS_BY_KEY=Object.fromEntries(MILESTONES.map(b=>[b.key,b]));
const msRec=k=>(M&&M.ms&&M.ms[k])||{};
const msBeaten=k=>!!msRec(k).beaten;
function msNext(){return MILESTONES.find(b=>!msBeaten(b.key))||null}
function msDue(loop){const b=msNext();if(!b)return null;loop=loop||M.loop;if(b.after){const p=msRec(b.after);return p.beaten&&loop>p.beaten?b:null}return loop>=b.loop?b:null}
// creatures more than 4 loops past the next unbeaten boss stay away
function poolLoop(){const b=msNext();return b&&b.loop?Math.min(M.loop,b.loop+4):M.loop}
const REGENT_FORMS={past:{name:'Past',arm:1.8,dmg:.8},present:{name:'Present',arm:1,dmg:1},future:{name:'Future',arm:.4,dmg:1.35}};
const FORM_ORDER=['past','present','future'];
function msFoe(st,B,mult){const b={name:B.name,hp:Math.round(FOE_BASE.hp*B.hp*(CFG.msHp||100)/100*(mult||1)),dmg:FOE_BASE.dmg.map(v=>Math.max(1,Math.round(v*B.dmg*(CFG.msDmg||100)/100))),
  arm:Math.round(FOE_BASE.arm*B.arm),dodge:0,xp:B.xp,attacks:1,ab:''};return b}
const TENTACLE={name:'Grasping Tentacle',hp:Math.round(FOE_BASE.hp*1.5),dmg:FOE_BASE.dmg.map(v=>Math.max(1,Math.round(v*.6))),arm:Math.round(FOE_BASE.arm*.5),dodge:0,xp:20,ab:'grab'};
function startMilestone(st,key){
  const B=MS_BY_KEY[key];st.msFought=true;
  // time holds its breath at the threshold: the living are restored to full (the fallen stay down)
  st.party.forEach(p=>{if(!p.down){p.hp=p.maxHp;p.dots=[]}});
  st.room={era:B.era,name:B.room,desc:B.desc,doors:{},entry:null,type:'boss',insp:0,past:!!B.past,echoBg:!!B.echo};
  DIRS.slice().sort(()=>Math.random()-.5).slice(0,rnd(1,2)).forEach(d=>st.room.doors[d]={});fillDoors(st,st.room);
  const lineup=[msFoe(st,B)];
  if(key==='king')lineup.push(FOE_BY_NAME['Bonewalker'],FOE_BY_NAME['Bonewalker']);
  if(key==='maw')lineup.push(TENTACLE,TENTACLE,TENTACLE);
  startFight(st,lineup,'boss');
  const f=st.enemies[0];f.ms=key;f.phase=1;f.baseArm=f.arm;f.snapHp=f.hp;
  if(key==='king')st.enemies.slice(1).forEach(g=>{g.guard=true});
  if(key==='sovereign'&&msRec(key).lastLost){f.rewindArm=true;f.note='Hands spinning backwards';}
  if(B.after)startReflection(st,f,B);
  if(key==='regent'){f.form=pick(FORM_ORDER);f.nextForm=FORM_ORDER[(FORM_ORDER.indexOf(f.form)+1)%3];regentForm(f)}
  M.ms=M.ms||{};M.ms[key]=Object.assign(msRec(key),{tries:(msRec(key).tries||0)+1});
  st.fight.ms={key,talk:B.talk};
  log(st,'Time holds its breath at the threshold. Your wounds close.');
  log(st,`${B.name} rises to meet you.`);
}
function regentForm(f){const F=REGENT_FORMS[f.form];f.arm=Math.round(f.baseArm*F.arm);f.note=`${F.name} form · next: ${REGENT_FORMS[f.nextForm].name}`}
// called from hitFoe when a boss drops to half life
function msPhase2(st,f){
  f.phase=2;
  if(f.ms==='king'){f.raises=1;log(st,'The King slams his sceptre down. "Rise, my loyal guard!"');msRaise(st,f)}
  else if(f.ms==='sovereign'){f.note=(f.note?f.note+' · ':'')+'Overclocked';log(st,'The Sovereign\'s gears scream. OVERCLOCK. It now acts twice each round.')}
  else if(f.ms==='champion'){if(f.perks.includes('chrono')){const h=Math.round(f.maxHp*.15);f.hp=Math.min(f.maxHp,f.hp+h);log(st,`Pull Time to Heel. The Champion's wounds close (+${h}).`)}log(st,'The Champion stops fighting like you and starts fighting as you. It copies your last move each round.')}
  else if(f.ms==='maw'){st.fight.costAdd=2;f.note='Eating the room: every action +2s';log(st,'The Maw swallows the room around you. Every action now costs 2 seconds more.')}
  else if(f.ms==='regent'&&!f.isTwin){

  if(rarity!=='common'){const pk=tickets(PREFIX.map(x=>[x[0],x[1]]));const p=PREFIX.find(x=>x[0]===pk);pre=p[2]+' ';add(p[3],p[4](t));preK=pk}

function calc(c,gear){

    critC:CFG.critBase,critD:CFG.critDmg,tempo:k.tempo,timePct:0,patient:0,renew:0};

  for(const sl in gear){const it=gear[sl];if(!it||it.locked)continue;const st=it.stats;if(it.uniq==='memory')memB=Math.min(30,(M&&M.loop||1)+(M&&M.ngp?10:0));
    s.maxHp+=st.hp||0;s.dmgMin+=st.dmg||0;s.dmgMax+=st.dmg||0;s.arm+=st.arm||0;s.dodge+=st.dodge||0;s.critC+=st.critC||0;s.critD+=st.critD||0;
    s.tempo+=st.tempo||0;s.timePct+=st.timePct||0;s.patient+=st.patient||0;s.renew=Math.max(s.renew,st.renew||0)} // Renewal: only the best piece counts
  if(memB){s.maxHp=Math.round(s.maxHp*(1+memB/100));s.dmgPct+=memB}
  if(c.talent){s.maxHp=Math.round(s.maxHp*(1+c.talent/100));s.timePct+=c.talent}
  if(c.cursed){s.maxHp=Math.round(s.maxHp*.9);s.dmgPct=(s.dmgPct||0)-10}
  if(c.key==='hero'&&M&&M.tree){const tf=TF();s.timePct+=tf.shard||0;s.tempo+=tf.tempo||0;s.dmgPct+=tf.dmg||0;s.critC+=tf.critC||0;s.critD+=tf.critD||0;
    s.maxHp+=tf.hp||0;s.arm+=tf.arm||0;s.dodge+=tf.dodge||0;s.maxHp=Math.max(1,Math.round(s.maxHp*(1+(tf.hpPct||0)/100)))}

}

function hire(rid,name){
  const r=M.tavern.find(x=>x.id===rid);if(!r)return;
  const cost=hireCost(r);if(M.crystals<cost)return;
  M.crystals-=cost;if(M.freeHires>0)M.freeHires--;
  const c=newChar(r.key,r.stranger?r.name:name,r.lvl,M.loop);
  if(r.stranger){c.stranger=r.stranger;c.colour=r.colour}

}
function memStage(c){const s=c.stranger;if(!s)return '';if(nemReady(s))return `Remembers how they fell. The ${esc(s.killer)} still holds their name. Bring them into the loop. ${leaves(s)}`;const f=s.mem/s.need;

function policy(st){
  const a=st.party[st.turn],foes=st.enemies.map((f,i)=>({f,i})).filter(x=>x.f.hp>0);
  const live=st.party.map((p,i)=>({p,i})).filter(x=>!x.p.down).sort((x,y)=>x.p.hp/x.p.maxHp-y.p.hp/y.p.maxHp);
  const downed=st.party.map((p,i)=>({p,i})).filter(x=>x.p.down);
  if(downed.length&&st.items.phoenix>0)return['phoenix',downed[0].i];
  const low=live[0],lowF=low.p.hp/low.p.maxHp;
  if(hasSkill(a,'mend')){
    if(a.blood&&hasSkill(a,'misery')&&!window.__spam)return['misery',null];
    if(lowF<.55&&(a.lilies||0)>0&&hasSkill(a,'lily'))return['lily',low.i];
    if(lowF<.3&&!(a.qcd>0))return['qheal',low.i];
    if(lowF<.4)return['mend',low.i];
  }else if(hasSkill(a,'rewind')&&!st.party.some(p=>!p.down&&hasSkill(p,'mend'))&&lowF<.6&&!low.p.regen)return['rewind',low.i];
  if(hasSkill(a,'holy')&&!window.__spam&&foes.length){const w=foes.slice().sort((x,y)=>x.f.hp-y.f.hp)[0];return['holy',w.i]}
  if(st.items.potion>0&&lowF<.25)return['potion',low.i];
  {const rw=foes.find(x=>x.f.rewindArm&&!x.f.slowed);if(rw&&hasSkill(a,'slow'))return['slow',rw.i]}
  const big=foes.slice().sort((x,y)=>y.f.hp-x.f.hp)[0],weak=foes.slice().sort((x,y)=>x.f.hp-y.f.hp)[0];
  if(hasSkill(a,'taunt')&&foes.length>=2)return['taunt',null];
  if(hasSkill(a,'volley')&&foes.length>=2)return['volley',null];
  if(hasSkill(a,'inspire')){const t=live.find(x=>x.p.key!=='bard'&&!x.p.buff);if(t&&foes.length)return['inspire',t.i]}
  if(hasSkill(a,'firebolt')&&foes.length>=2)return['firebolt',null];
  if(window.__spam)return['attack',weak.i];
  for(const k of ['backstab','smite','firebolt','flurry'])if(hasSkill(a,k)&&(big.f.tier!=='reg'||big.f.hp>25||big.f.arm>0))return[k,big.i];
  if(hasSkill(a,'bolt')&&big.f.ab!=='mirror'&&(big.f.tier!=='reg'||big.f.arm>0||big.f.hp>30))return['bolt',big.i];
  return['attack',weak.i];
}
function autoEquip(st){st.party.forEach((m,mi)=>{st.bag.filter(it=>it.lvl<=m.lvl).forEach(it=>{const cur=m.gear[it.slot];if(!cur||power(it.stats)>power(cur.stats))equip(st,mi,it.id)})})}
function simRun(keys,lvl,gear,loop){
  const saveM=M,saveS=S;
  M={loop:loop||1,crystals:0,freeHires:0,chars:[],party:[],fallen:[],tavern:[],events:[]};
  const h=newChar('hero','Sim',lvl);M.chars.push(h);
  keys.forEach(k=>{const c=newChar(k,k,lvl);M.chars.push(c);M.party.push(c.id)});
  startRun(false);let g=0;
  while(S.phase!=='end'&&g++<20000){
    if(S.phase==='room'){if(gear)autoEquip(S);const md=Object.keys(S.room.doors).find(d=>S.room.doors[d].milestone);chooseDoor(S,md||pick(Object.keys(S.room.doors)))}
    else if(S.phase==='summary')closeSummary(S);
    else{const [x,t]=policy(S);act(S,x,t)}
  }
  const r={msFought:!!S.msFought,msWon:!!S.msWon,msRounds:S.msRounds||0,gold:S.gold||0,bagValue:S.bag.reduce((a,it)=>a+sellValue(it),0),crystals:S.crystals,result:S.result.kind,survival:S.survival,lvl:avgLvl(S),items:S.stats.items,earned:S.stats.earnFoes+S.stats.earnTreasure,spent:S.stats.spentAct+S.stats.spentMove};
  M=saveM;S=saveS;return r;
}
window.__sim=(n,keys,lvl,gear)=>Array.from({length:n},()=>simRun(keys,lvl||1,gear));

function speak(key,label,lines){
  const body=lines.map(l=>l.startsWith('*')?`<span class="small"><i>${esc(l.replace(/\*/g,''))}</i></span>`:`<q>${esc(l)}</q>`).join('');
  const k=PT_IMG.includes(key)?key:'shadow';

const CHAR_ATLAS={img:null,ok:false};
function charImg(){if(!CHAR_ATLAS.img){const i=new Image();i.onload=()=>{CHAR_ATLAS.ok=true};i.src='sprites/chars.webp';CHAR_ATLAS.img=i}return CHAR_ATLAS.ok?CHAR_ATLAS.img:null}
// feetX/feetY in canvas pixels. Returns false until the atlas has loaded, so callers can fall back to the old sprite.
function drawChar(g,key,feetX,feetY,o){
  const img=charImg(),r=CHAR_META[key];if(!img||!r)return false;const[x,y,w,h,fx]=r;o=o||{};
  g.save();g.globalAlpha=o.alpha==null?1:o.alpha;if(o.flash)g.filter='brightness(5)';g.imageSmoothingEnabled=false;
  if(o.s){const sw=Math.round(w*o.s),sh=Math.round(h*o.s);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
    g.drawImage(img,x,y,w,h,Math.round(feetX-fx*o.s),Math.round(feetY-sh),sw,sh);g.restore();return true}
  const dy=Math.round(feetY-h);
  if(o.flip){const dx=Math.round(feetX-(w-fx));g.translate(dx+w,dy);g.scale(-1,1);g.drawImage(img,x,y,w,h,0,0,w,h)}
  else g.drawImage(img,x,y,w,h,Math.round(feetX-fx),dy,w,h);
  g.restore();return true;
}

function wizardLine(){

  if(lost)return `I'm sorry about ${lost.name}. Truly. Time is cruel, and I made it crueller.`;
  const rec=ev.find(e=>e.type==='recall');
  if(rec)return `${rec.to}... yes. I remember them too. I wondered if you would get them back.`;
  const ms=ev.find(e=>e.type==='milestone');
  if(ms)return {king:'The King, gone at last. I knew him, once. Before. Never mind.',sovereign:'You broke the Sovereign? I built... I mean, someone built that. Well done.',maw:'The Maw is quiet. The ground feels firmer already. Thank you.',regent:'The Regent... all three of him. You remarkable fool. We\'re close now.',champion:'You beat yourself. Or the self you were meant to be. Come here, I need to tell you something.'}[ms.key];
  const due=msDue(M.loop);
  if(due&&!(msRec(due.key).tries))return {king:'Something old has woken at the Edge. Last twenty minutes or so and you\'ll find a door that shouldn\'t be there. A king waits behind it.',sovereign:'Do you hear ticking? That\'s the Sovereign. Survive long enough and its door will find you.',maw:'The ground has been... hungry lately. Something below wants a word. A door will open, late in your run.',regent:'He\'s waiting. The Regent. Past, present and future in one tired body. Late in your run, look for his door.',champion:'The loop has made something out of you. The you that died that day. It\'s in the echoes, late in your run. Be kinder to it than it will be to you.',rememberer:'It\'s waiting. It looks like me. Whatever it says, don\'t listen. I never stopped trying. Not once.'}[due.key];

    bar.innerHTML='<span>'+html+'</span>'+buttons;document.body.appendChild(bar);
    var b=bar;requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})});return b}
  function latest(){return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function now(){if(busy)return;busy=true;
    // Only clear the offline copy once we know the newest version can be downloaded.
    latest().then(function(){
      try{window.kgBeforeUpdate&&window.kgBeforeUpdate()}catch(e){}
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+dir)===0}).map(function(r){return r.unregister()}))}))}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return CACHES.some(function(p){return k.indexOf(p)===0})}).map(function(k){return caches.delete(k)}))}))}catch(e){}
      var done=false,go=function(){if(done)return;done=true;location.replace(path+'?v='+Date.now())};
      Promise.all(jobs).then(go,go);setTimeout(go,3000);
    },function(){busy=false;
      var b=note('No connection right now. Get online, then try again.','<button type="button" class="kg-later">OK</button>');
      b.querySelector('.kg-later').onclick=hide;setTimeout(function(){if(bar===b)hide()},6000);
    });
  }
  function show(v){if(bar||skipped(v))return;
    var b=note('A new version of '+NAME+' is ready.','<button type="button" class="kg-later">Later</button><button type="button" class="kg-go">Update</button>');
    b.querySelector('.kg-go').onclick=now;
    b.querySelector('.kg-later').onclick=function(){try{sessionStorage.setItem('kg-upd-skip',v)}catch(e){}hide()};
  }
  function check(force){if(!CHECK)return;var t=Date.now();if(!force&&t-last<6e5)return;last=t;
    latest().then(function(j){if(j&&j.version!=null&&String(j.version)!==build())show(String(j.version))}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-get-latest]');if(!b)return;e.preventDefault();e.stopPropagation();now()},true);
  addEventListener('load',function(){setTimeout(function(){check(true)},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  setInterval(function(){if(!document.hidden)check(false)},18e5);
  window.KralnuUpdate={now:now,check:function(){check(true)},build:build};
})();
</script>
