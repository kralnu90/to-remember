<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>30 × to Remember</title>
<meta name="description" content="A time-loop dungeon crawler from Kralnu Games. Every action costs time, the loop always resets, and the friends you lose might come back as strangers.">
<meta property="og:title" content="30 × to Remember">
<meta property="og:description" content="A time-loop dungeon crawler. Every action costs time, and the loop always resets.">
<meta property="og:image" content="https://kralnugames.com/to-remember.jpg">
<meta name="theme-color" content="#16141d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; clocks pinned on top, the room or fight in the middle, the party and actions below. */
:root{
  color-scheme: dark;
  --ink:#16141d;        /* night-blue page */
  --slate:#211e2b;      /* panels */
  --line:#3a3547;       /* hairlines */
  --parch:#ece3cc;      /* text */
  --dim:#a79f8d;        /* secondary text */
  --brass:#e0ae52;      /* time, the accent */
  --present:#c9925c;    /* Present era: warm stone */
  --future:#86ad6f;     /* Future era: moss */
  --good:#8fc77a;
  --bad:#e07a66;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  --mono:"Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.btn{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px;text-align:left}
.btn:hover{border-color:var(--brass)}
.btn[disabled]{opacity:.38;cursor:not-allowed;border-color:var(--line)}
.btn.primary{background:var(--brass);color:#1d1606;border-color:var(--brass);font-weight:700;text-align:center}
.btn.ghost{background:transparent}
.cost{font-family:var(--mono);font-size:12px;color:var(--brass);white-space:nowrap}

/* clocks */
.clocks{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--ink);padding-block:10px 8px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.clock .val{font-family:var(--mono);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.clock.left .val{color:var(--brass)}
.clock.left.low .val{color:var(--bad)}
.clock.surv{text-align:right}
.bar{height:6px;background:var(--slate);border-radius:3px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--parch);width:0}
.delta{font-family:var(--mono);font-size:13px;margin-left:6px;transition:opacity .6s}
.delta.neg{color:var(--bad)} .delta.pos{color:var(--good)}

/* room */
.room{display:grid;gap:10px}
.roomhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.era{font-size:12px;text-transform:uppercase;letter-spacing:.14em;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.era.present{color:var(--present)} .era.future{color:var(--future)}
.desc{color:var(--dim);margin:0}
.square{display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:64px minmax(130px,auto) 64px;gap:6px;max-width:360px;width:100%;margin:4px auto 0}
.cell{display:flex;align-items:center;justify-content:center}
.floor{grid-column:2;grid-row:2;border:2px solid var(--line);border-radius:6px;padding:12px;text-align:center;flex-direction:column;gap:6px;
  background:repeating-linear-gradient(45deg, transparent 0 12px, rgba(255,255,255,.02) 12px 24px), var(--slate)}
.floor.present{border-color:color-mix(in srgb, var(--present) 55%, var(--line))}
.floor.future{border-color:color-mix(in srgb, var(--future) 55%, var(--line))}
.door{width:58px;height:58px;border-radius:29px 29px 6px 6px;border:2px solid var(--brass);background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0}
.door b{font-family:var(--display);font-size:26px;line-height:1;color:var(--brass)}
.door .cost{font-size:10px}
.door.came{border-style:dashed;border-color:var(--line);cursor:default}
.door.came b{color:var(--line);font-size:14px}
.n{grid-column:2;grid-row:1}.s{grid-column:2;grid-row:3}.w{grid-column:1;grid-row:2}.e{grid-column:3;grid-row:2}
.note{border-left:3px solid var(--brass);padding:8px 12px;background:var(--slate);border-radius:0 8px 8px 0}

/* fight */
.battle{display:block;width:100%;max-width:100%;aspect-ratio:16/9;height:auto;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);background:#16141d;cursor:pointer}
.tmap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#3f6a35}
.tmap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.tplace{position:absolute;background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;line-height:1.2;border-radius:6px}
.tplace .tlbl{font:700 11px var(--body);background:#efe4c6;color:#2b2116;border:2px solid #5a4632;padding:1px 6px;box-shadow:2px 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.tplace:hover .tlbl,.tplace:focus-visible .tlbl{background:#f6d78f;border-color:var(--brass)}
.tplace:focus-visible{outline:2px solid var(--brass);outline-offset:0}
.tbadge{position:absolute;top:0;right:4%;min-width:18px;height:18px;padding:0 4px;background:var(--brass);color:#1d1606;border:2px solid #2b2116;font:700 11px var(--mono);display:flex;align-items:center;justify-content:center}
.menu{display:grid;gap:12px;padding-top:8px}
.menuhead{display:grid;gap:12px}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:360px){.menugrid{grid-template-columns:1fr}}
.btn.mb{display:grid;gap:2px;text-decoration:none;align-content:center}
a.btn{color:inherit}
.btn.mb b{font-weight:700}
.btn.mb span{font-size:13px;color:var(--dim);font-weight:400}
.btn.primary.mb span{color:#3a2c0e}
.stars{display:flex;gap:6px}
.star{font-size:30px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}
.star.on{color:var(--brass)}
.field textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit;min-height:84px;width:100%;resize:vertical}
body.big .wrap{zoom:1.12}
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;text-align:left;min-width:0}
.card .nm{font-weight:700;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--dim)}
.hp{height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.hp > i{display:block;height:100%;background:var(--bad)}
.party .hp > i{background:var(--good)}
.card.dead{opacity:.35}
.card.target{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb, var(--brass) 35%, transparent)}
.card.active{border-color:var(--parch)}
.card.elite .nm{color:var(--brass)}
.party{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.party .card.down{opacity:.45}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--brass)}
.rollrow{display:block}
.actions .btn .si{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.log{font-size:14px;color:var(--dim);display:grid;gap:2px;max-height:132px;overflow:auto;min-width:0}
.log div:first-child{color:var(--parch)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.turnline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

/* overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,9,14,.78);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet > div{background:var(--slate);border:1px solid var(--line);border-radius:14px;width:100%;max-width:540px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.ledger .total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px}
.stats span:nth-child(even){font-family:var(--mono);text-align:right}

/* setup */
.title{font-family:var(--display);font-size:44px;line-height:1.02}
.title .x{color:var(--brass)}
.field{display:grid;gap:6px}
.field input{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit;min-height:44px;width:100%}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;text-align:center}
.seg .btn.on,.pick.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 14%, var(--slate))}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{display:grid;gap:2px;text-align:left}
.tune{display:grid;gap:14px}
.tune fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin:0}
.tune legend{padding:0 6px;color:var(--brass);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.tune label{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;font-size:15px}
.tune input{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--parch);font-family:var(--mono);width:100%;min-height:40px}
.credit{font-size:13px;color:var(--dim);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* town, gear, loot */
.r-common{color:#d8d0bd}.r-uncommon{color:#93cf7e}.r-rare{color:#7fb0e8}.r-epic{color:#c09bef}
.sb{color:var(--brass);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;background:var(--ink);text-align:left;min-width:0}
.item.soul{border-color:var(--brass);box-shadow:0 0 10px color-mix(in srgb, var(--brass) 30%, transparent)}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .st{font-family:var(--mono);font-size:12px;color:var(--dim)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:grid;gap:2px;text-align:left;min-width:0}
.slot .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.slot.sel{border-color:var(--parch)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs .btn{flex:none;min-height:40px;padding:6px 12px}
.tabs .btn.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 14%, var(--slate))}
.up{color:var(--good)}.down{color:var(--bad)}
.wizard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--slate);display:grid;gap:4px}
.wizard q{font-style:italic;quotes:"“" "”"}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster .card.on{border-color:var(--brass);background:color-mix(in srgb, var(--brass) 12%, var(--slate))}
.stranger .nm{font-style:italic}
.flavour{font-size:12px;color:var(--brass);font-style:italic}
.tavern{display:grid;gap:8px}
.recruit{display:flex;justify-content:space-between;align-items:center;gap:10px}
.door.echo{border-color:var(--echo, #8fd3d0);width:58px}
.door.echo b{font-size:11px;font-family:var(--body);font-weight:700;color:var(--echo, #8fd3d0);line-height:1.1;text-align:center}
.namefade{display:grid;justify-items:center;gap:6px;padding:12px 0}
.namefade .old{font-family:var(--display);font-size:28px;color:var(--dim);animation:fadeout 2.2s forwards}
.namefade .new{font-family:var(--display);font-size:36px;color:var(--brass);opacity:0;animation:fadein 1.6s 1.4s forwards}
@keyframes fadeout{0%{opacity:1}60%{opacity:1}100%{opacity:.15;text-decoration:line-through}}
@keyframes fadein{to{opacity:1}}
.events{display:grid;gap:8px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;min-width:0}
.inline .btn{flex:none}
.small{font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion: reduce){.namefade .new{opacity:1}}
.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0}
.map svg{width:100%;height:auto;display:block}
.map [data-place]{cursor:pointer;outline:none}
.map .lbl rect{fill:#efe4c6;stroke:#5a4632;stroke-width:1}
.map .lbl text{font:700 11px var(--body);fill:#2b2116}
.map [data-place]:hover .lbl rect,.map [data-place]:focus-visible .lbl rect{fill:#f6d78f;stroke:#e0ae52;stroke-width:2}
.map .badge circle{fill:#e0ae52;stroke:#2b2116;stroke-width:1.5}.map .badge text{font:700 11px var(--mono);fill:#1d1606}
.riftglow{animation:rift 3s ease-in-out infinite;transform-origin:190px 56px}
@keyframes rift{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.towerglow{animation:tglow 2.4s ease-in-out infinite}@keyframes tglow{50%{opacity:.4}}
.flame{animation:flick .6s ease-in-out infinite alternate;transform-origin:190px 382px}@keyframes flick{to{transform:scaleY(1.15) scaleX(.92)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
@media (prefers-reduced-motion: reduce){.riftglow,.towerglow,.flame{animation:none}}
.intro{position:fixed;inset:0;z-index:30;background:#07060a;border:0;display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer}
.intro span{font-family:var(--display);font-size:24px;color:var(--parch);font-style:italic;opacity:0;animation:fadein 1.4s .3s forwards;text-align:center}
.wizard q{display:block}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet" class="sheet" hidden></div>

<script>
/* ======================= helpers ======================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const roll=(n,s)=>{let t=0;for(let i=0;i<n;i++)t+=rnd(1,s);return t};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')};
const secs=s=>(Math.round(s*10)/10).toString().replace(/\.0$/,'')+'s';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
const tickets=list=>{let t=Math.random()*list.reduce((a,b)=>a+b[1],0);for(const x of list){if((t-=x[1])<0)return x[0]}return list[list.length-1][0]};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ======================= tuning ======================= */
const TUNE=[
 ['Run',[['startTime','Starting time left (seconds)',300],['target','Survival target (seconds)',1800]]],
 ['Basic action costs (seconds)',[['cAttack','Attack',3],['cSpell','Time Bolt',7],['cHeal','Rewind wounds',5],['cItem','Use an item',2],['cDefend','Defend',2],['cMove','Move to the next room',10]]],
 ['Time drops (seconds)',[['dRegMin','Regular enemy, lowest',13],['dRegMax','Regular enemy, highest',19],['dEliteMin','Elite, lowest',55],['dEliteMax','Elite, highest',80],['dBossMin','Mini-boss, lowest',100],['dBossMax','Mini-boss, highest',140],['dTreasMin','Treasure room, lowest',30],['dTreasMax','Treasure room, highest',50]]],
 ['Smaller party bonus (multiplier)',[['b1','Solo',1.25],['b2','Two',1.12],['b3','Three',1.05],['b4','Four',1]]],
 ['Loot (%)',[['soulbound','Soulbound chance per drop',12],['dropReg','Item drop chance per regular enemy',20],['dropTreasure','Item chance in treasure rooms',40],['crystalReg','Crystal chance per fight',15]]],
 ['Companions',[['returnBase','Fallen return chance, base (%)',40],['returnPerLoop','Extra return chance per loop together (%)',10],['echoChance','Distant Echo chance per room (%)',30]]],
 ['Combat',[['critBase','Base crit chance (%)',5],['critDmg','Base crit damage (%)',150],['lvlDmg','Damage per character level (%)',10],['lvlArm','Armour per character level',3],['armK','Armour curve, base',30],['armLvl','Armour curve, per level',10],['defendCut','Damage cut while defending (%)',50]]],
 ['Enemies (%)',[['hpMult','Base life (%)',80],['soloLife','Life when you go solo (%)',90],['hpScale','Life growth per minute survived',3.5],['lvlScale','Life growth per party level',13],['dmgScale','Damage growth per minute survived',3.5],['dmgLvl','Damage growth per party level',7],['armScale','Armour growth per minute survived',4]]]
];
const DEFAULTS={};TUNE.forEach(g=>g[1].forEach(([k,,v])=>DEFAULTS[k]=v));
let CFG=Object.assign({},DEFAULTS,store.get('t2r-tune2')||{});

/* ======================= classes ======================= */
// speed: 1 slow, 2 medium, 3 fast. tempo: % off the time cost of this character's actions.
// dmg: weapon damage range. arm: armour (cuts damage taken, see armCut). dodge: % chance to avoid a hit.
const CLASSES={
 hero:{cls:'Fixed Point',hp:34,dmg:[4,9],arm:24,dodge:0,speed:2,tempo:5,grow:5,skills:[{key:'bolt',name:'Time Bolt',lvl:1},{key:'rewind',name:'Rewind wounds',lvl:1}]},
 warrior:{cls:'Warrior',hp:40,dmg:[5,10],arm:40,dodge:0,speed:1,tempo:0,grow:6,skills:[{key:'taunt',name:'Taunt',lvl:5}],blurb:'Tank'},
 paladin:{cls:'Paladin',hp:36,dmg:[4,9],arm:44,dodge:0,speed:1,tempo:0,grow:5,skills:[{key:'smite',name:'Smite',lvl:5}],blurb:'Tank, some healing'},
 cleric:{cls:'Cleric',hp:28,dmg:[3,6],arm:24,dodge:0,speed:2,tempo:0,grow:4,skills:[{key:'mend',name:'Mend',lvl:5}],blurb:'Healer'},
 rogue:{cls:'Rogue',hp:24,dmg:[4,9],arm:16,dodge:12,speed:3,tempo:10,grow:3,skills:[{key:'backstab',name:'Backstab',lvl:5}],blurb:'Big single hits'},
 ranger:{cls:'Ranger',hp:28,dmg:[4,9],arm:20,dodge:6,speed:3,tempo:5,grow:4,skills:[{key:'volley',name:'Volley',lvl:5}],blurb:'Hits several enemies'},
 mage:{cls:'Mage',hp:20,dmg:[3,7],arm:8,dodge:0,speed:2,tempo:0,grow:2,skills:[{key:'firebolt',name:'Firebolt',lvl:5}],blurb:'Area magic'},
 monk:{cls:'Monk',hp:28,dmg:[3,8],arm:24,dodge:10,speed:3,tempo:10,grow:4,twice:true,skills:[{key:'flurry',name:'Flurry',lvl:5}],blurb:'Hits twice'},
 bard:{cls:'Bard',hp:26,dmg:[3,6],arm:16,dodge:4,speed:2,tempo:15,grow:3,skills:[{key:'inspire',name:'Inspire',lvl:5}],blurb:'Support, time tricks'}
};
const COMP_KEYS=Object.keys(CLASSES).filter(k=>k!=='hero');

// old saves: turn D&D stats on gear into the new ones
function migrateItem(it){const s=it.stats;if(!s)return;
  if('ac' in s){s.arm=(s.arm||0)+s.ac*5;delete s.ac}
  if('hit' in s){s.critC=(s.critC||0)+s.hit*2;delete s.hit}
  if('crit' in s){s.critC=(s.critC||0)+s.crit*5;delete s.crit}

function migrateAll(o,seen){if(!o||typeof o!=='object')return;seen=seen||new Set();if(seen.has(o))return;seen.add(o);
  if(o.slot&&o.stats&&o.rarity){migrateItem(o);return}
  if(Array.isArray(o.dmg)&&o.dmg.length===3&&'maxHp' in o&&o.tier){const d=o.dmg;o.dmg=[d[0]+d[2],d[0]*d[1]+d[2]];o.arm=o.arm||0;o.dodge=o.dodge||0;o.lvl=o.lvl||1;delete o.ac;delete o.hit}
  for(const k in o)migrateAll(o[k],seen)}
function makeItem(ilvl,minRarity){
  ilvl=Math.max(1,ilvl);
  let t=0;MATERIALS.forEach(([,l],i)=>{if(ilvl>=l)t=i});
  const slot=pick(SLOTS);
  let rarity=tickets(RARITY);
  const order=['common','uncommon','rare','epic'];
  if(minRarity&&order.indexOf(rarity)<order.indexOf(minRarity))rarity=minRarity;
  const stats={};const add=(k,v)=>stats[k]=(stats[k]||0)+v;
  const base=BASE[slot](t);const mult=rarity==='epic'?1.5:1;
  for(const k in base)add(k,Math.round(base[k]*mult));
  let pre='',suf='';
  if(rarity!=='common'){const pk=tickets(PREFIX.map(x=>[x[0],x[1]]));const p=PREFIX.find(x=>x[0]===pk);pre=p[2]+' ';add(p[3],p[4](t))}
  if(rarity==='rare'||rarity==='epic'){const sk=tickets(SUFFIX.map(x=>[x[0],x[1]]));const s=SUFFIX.find(x=>x[0]===sk);suf=' '+s[2];add(s[3],s[4](t))}
  return {id:uid(),slot,rarity,lvl:ilvl,name:pre+MATERIALS[t][0]+' '+PIECE[slot]+suf,stats,soul:Math.random()*100<CFG.soulbound};
}

function calc(c,gear){
  const k=CLASSES[c.key],L=c.lvl;
  const s={maxHp:k.hp+k.grow*(L-1),dmgMin:k.dmg[0],dmgMax:k.dmg[1],dmgPct:CFG.lvlDmg*(L-1),arm:k.arm+Math.round(CFG.lvlArm*(L-1)),dodge:k.dodge,
    critC:CFG.critBase,critD:CFG.critDmg,tempo:k.tempo,timePct:0,patient:0};
  for(const sl in gear){const it=gear[sl];if(!it)continue;const st=it.stats;
    s.maxHp+=st.hp||0;s.dmgMin+=st.dmg||0;s.dmgMax+=st.dmg||0;s.arm+=st.arm||0;s.dodge+=st.dodge||0;s.critC+=st.critC||0;s.critD+=st.critD||0;
    s.tempo+=st.tempo||0;s.timePct+=st.timePct||0;s.patient+=st.patient||0}
  if(c.talent){s.maxHp=Math.round(s.maxHp*(1+c.talent/100));s.timePct+=c.talent}
  s.tempo=Math.min(50,s.tempo);s.patient=Math.min(60,s.patient);s.dodge=Math.min(30,s.dodge);s.critC=Math.min(60,s.critC);
  return s;
}
// share of damage armour stops against an attacker of this level: never more than 75%
function armCut(arm,lvl){return Math.min(.75,arm/(arm+CFG.armK+CFG.armLvl*Math.max(1,lvl)))}
function refresh(m){delete m.ac;delete m.hit;delete m.dmgB;delete m.crit;const s=calc(m,m.gear);const gain=s.maxHp-(m.maxHp||s.maxHp);Object.assign(m,s);if(!m.down)m.hp=Math.max(1,Math.min(m.maxHp,(m.hp??m.maxHp)+Math.max(0,gain)))}
function hasSkill(m,key){return CLASSES[m.key].skills.some(s=>s.key===key&&m.lvl>=s.lvl)}
function costOf(m,act){const A=ACTIONS[act];let c=typeof A.cost==='string'?CFG[A.cost]:A.cost;c*=1-(m.tempo||0)/100;if(A.heal)c*=1-(m.patient||0)/100;return Math.round(c*10)/10}

const T=st=>st.target||CFG.target;

function startRun(quick){
  const ids=['hero'].concat(M.party);
  const party=ids.map(id=>id==='hero'?hero():M.chars.find(c=>c.id===id)).filter(Boolean).map(c=>{const m=clone(c);m.hp=null;m.maxHp=null;m.down=false;m.downAt=null;refresh(m);m.hp=m.maxHp;return m});

    enemies:[],turn:0,log:[],bossesDone:[],room:null,roomMsg:'',fight:null,sum:null,result:null,echoesFollowed:{},
    stats:{rooms:0,fights:0,kills:0,actions:0,spentAct:0,spentMove:0,earnFoes:0,earnTreasure:0,best:null,worst:null,playMs:0,items:0},

function makeRoom(st,entry){
  const futureShare=Math.min(.8,.2+minutes(st)/40);
  const era=Math.random()<futureShare?'future':'present';
  const [name,desc]=pick(PLACES[era]);
  const doors={};DIRS.filter(d=>d!==entry).sort(()=>Math.random()-.5).slice(0,rnd(1,3)).forEach(d=>doors[d]={});
  // a Distant Echo can replace one door for a companion still retracing their steps
  const seekers=st.party.filter(m=>m.stranger&&!m.down&&m.stranger.mem<m.stranger.need);
  if(seekers.length&&Math.random()*100<CFG.echoChance){const s=pick(seekers);const d=pick(Object.keys(doors));doors[d]={echo:s.id}}
  return {era,name,desc,doors,entry,type:null,insp:0};
}
function spend(st,s,kind){
  st.timeLeft-=s;st.survival+=s;st.delta=-s;
  if(kind==='move')st.stats.spentMove+=s;else{st.stats.spentAct+=s;st.stats.actions++;if(st.fight)st.fight.spent+=s}
  const now=Date.now();st.stats.playMs+=Math.min(60000,Math.max(0,now-st.lastTick));st.lastTick=now;
  if(st.timeLeft<=0){end(st,'timeout');return false}
  if(st.survival>=T(st)){end(st,'clear');return false}
  return true;
}
function end(st,kind){st.phase='end';st.result={kind};st.enemies=[];st.lock=kind==='clear'?'ready':'none'}
function chooseDoor(st,dir){
  if(st.phase!=='room'||!st.room.doors[dir])return;
  const door=st.room.doors[dir];
  if(!spend(st,CFG.cMove,'move'))return;
  st.stats.rooms++;
  if(door.echo){
    const m=st.party.find(x=>x.id===door.echo);
    const lm=m.stranger.landmark;
    st.room={era:lm.era,name:lm.name,desc:'A place you have never been. Or have you?',doors:{},entry:OPP[dir],type:'echo'};
    DIRS.filter(d=>d!==OPP[dir]).sort(()=>Math.random()-.5).slice(0,rnd(1,3)).forEach(d=>st.room.doors[d]={});
    st.echoesFollowed[m.id]=(st.echoesFollowed[m.id]||0)+1;
    st.roomMsg=`${m.name} stops dead. "I've... been here before." Something is coming back to them.`;
    return;
  }
  if(st.script===1){st.script=2;
    st.room={era:'present',name:'Market Square',desc:'Stalls frozen mid-sale. A dropped apple hangs in the air. Something moves beneath the market awning.',doors:{},entry:OPP[dir],type:'fight',insp:0};
    DIRS.filter(d=>d!==OPP[dir]).slice(0,2).forEach(d=>st.room.doors[d]={});
    log(st,'You step forward. The world shifts around you.');
    startFight(st,[FOES.present.find(f=>f.name==='Time-Torn Hound'),FOES.present.find(f=>f.name==='Clockwork Rat')],'reg');return}
  if(st.script===2){st.script=0;
    st.room={era:'present',name:'Fountain Court',desc:'The water stands still in a glass arc. A bird hangs motionless above the fountain. For a moment, you think you see someone standing on the opposite side.',doors:{},entry:OPP[dir],type:'quiet',insp:0};
    DIRS.filter(d=>d!==OPP[dir]).sort(()=>Math.random()-.5).slice(0,rnd(2,3)).forEach(d=>st.room.doors[d]={});
    st.roomMsg='';return}
  const r=makeRoom(st,OPP[dir]);st.room=r;st.roomMsg='';
  const due=BOSSES.find(b=>st.survival>=b.at*T(st)/1800&&!st.bossesDone.includes(b.at));
  if(due){r.type='boss';r.era=due.era;r.name=due.room;r.desc='Something old has been waiting for you.';startFight(st,[due],'boss');return}
  const m=minutes(st);
  const type=tickets([['fight',48],['elite',m>=3?7:0],['treasure',12],['shrine',7],['quiet',26]]);
  r.type=type;
  if(type==='fight'){
    const count=Math.min(st.party.length+1,1+(Math.random()<.5)+(m>8&&Math.random()<.4)+(m>18&&Math.random()<.3));
    startFight(st,Array.from({length:count},()=>pick(FOES[r.era])),'reg');
  }else if(type==='elite'){
    startFight(st,[ELITES[r.era]].concat(m>12&&Math.random()<.5?[pick(FOES[r.era])]:[]),'elite');
  }else if(type==='treasure'){
    const g=Math.round(rnd(CFG.dTreasMin,CFG.dTreasMax)*partyBonus(st)*timeMult(st));
    st.timeLeft+=g;st.delta=g;st.stats.earnTreasure+=g;
    const extra=[];
    if(Math.random()<.3){st.items.potion++;extra.push('a potion')}
    if(Math.random()*100<CFG.dropTreasure){const it=makeItem(Math.round(avgLvl(st))+rnd(-1,2));st.bag.push(it);st.stats.items++;extra.push(it.name)}
    st.roomMsg=`A cache of time shards: +${g}s${extra.length?', plus '+extra.join(' and '):''}.`;
  }else if(type==='shrine'){
    st.party.forEach(p=>{if(!p.down)p.hp=Math.min(p.maxHp,p.hp+Math.ceil(p.maxHp*.4))});
    st.roomMsg='A quiet shrine. The living rest and recover 40% of their health.';
  }else st.roomMsg='Nothing here but the sound of a clock that is not there.';
}
function scaleFoe(st,base,tier){

    lvl:Math.max(1,Math.round(L+1+m/5)),arm:Math.round(base.arm*(1+CFG.armScale/100*m+.1*L)),dodge:base.dodge,
    dmg:base.dmg.map(v=>Math.max(1,Math.round(v*(1+CFG.dmgScale/100*m+CFG.dmgLvl/100*L)))),xp:base.xp,attacks:st.party.length>=3?(base.attacks||1):1,bossAt:base.at};
}
function startFight(st,bases,kind){
  st.enemies=bases.map((b,i)=>{const f=scaleFoe(st,b,i===0?kind:'reg');f.hp=f.maxHp;return f});
  st.phase='combat';st.fight={spent:0,kind};st.stats.fights++;
  st.party.forEach(p=>{p.defending=false;p.taunting=false;p.buff=null});
  st.turn=st.party.findIndex(p=>!p.down);

function hitFoe(st,f,amt){f.hp=Math.max(0,f.hp-amt);if(f.hp===0){log(st,`${f.name} falls.`);st.stats.kills++}}
// pct: % of weapon damage. Hits always land unless the foe dodges. Returns damage dealt.
function strike(st,a,f,pct,verb,critBonus){
  if(Math.random()*100<f.dodge){log(st,`${f.name} dodges ${a.name}.`);bfx({k:'miss',a,f,txt:'dodge'});return 0}
  const b=a.buff||{};
  let d=rnd(a.dmgMin,a.dmgMax)*(1+(a.dmgPct+(b.dmg||0))/100)*pct/100;
  const crit=Math.random()*100<a.critC+(b.crit||0)+(critBonus||0);if(crit)d*=a.critD/100;
  d=Math.max(1,Math.round(d*(1-armCut(f.arm,a.lvl))));
  log(st,`${a.name} ${crit?'crits':verb||'hits'} ${f.name} for ${d}.`);hitFoe(st,f,d);bfx({k:'hit',a,f,d,crit});return d;
}
function heal(st,a,ally,pct,verb){const h=Math.round(ally.maxHp*pct/100)+a.lvl;ally.hp=Math.min(ally.maxHp,ally.hp+h);bfx({k:'heal',a,t:ally,h});
  log(st,`${a.name} ${verb} ${ally.name===a.name?'their own':ally.name+"'s"} wounds: +${h}.`)}
function canUse(st,act){
  if(act==='potion')return st.items.potion>0&&st.party.some(p=>!p.down&&p.hp<p.maxHp);
  if(act==='phoenix')return st.items.phoenix>0&&st.party.some(p=>p.down);
  return true;
}
function act(st,act,ti){
  if(st.phase!=='combat')return;
  const a=st.party[st.turn],A=ACTIONS[act];
  const foe=ti!=null?st.enemies[ti]:null,ally=ti!=null?st.party[ti]:null;
  if(A.target==='enemy'&&(!foe||foe.hp<=0))return;
  if(A.target==='ally'&&(!ally||ally.down))return;
  if(A.target==='downed'&&(!ally||!ally.down))return;
  if(!canUse(st,act))return;
  const c=costOf(a,act),live=()=>st.enemies.filter(f=>f.hp>0);
  switch(act){
    case 'attack':strike(st,a,foe,100);if(CLASSES[a.key].twice&&foe.hp>0)strike(st,a,foe,100);break;
    case 'bolt':strike(st,a,foe,280,'blasts');break;
    case 'smite':{const d=strike(st,a,foe,230,'smites');if(d){const h=Math.ceil(d*.3);a.hp=Math.min(a.maxHp,a.hp+h);bfx({k:'heal',a,t:a,h})}break}
    case 'backstab':strike(st,a,foe,300,'backstabs',30);break;
    case 'firebolt':live().forEach(f=>strike(st,a,f,160,'burns'));break;
    case 'flurry':for(let i=0;i<3&&foe.hp>0;i++)strike(st,a,foe,90);break;
    case 'volley':live().slice(0,3).forEach(f=>strike(st,a,f,125,'shoots'));break;
    case 'taunt':a.taunting=true;bfx({k:'buff',a,txt:'taunt'});log(st,`${a.name} roars a challenge. Every enemy turns on them.`);break;
    case 'defend':a.defending=true;bfx({k:'buff',a,txt:'brace'});log(st,`${a.name} braces.`);break;
    case 'inspire':ally.buff={dmg:25,crit:15,rounds:2};bfx({k:'buff',a,t:ally,txt:'inspired'});log(st,`${a.name} inspires ${ally.name}: +25% damage and +15% crit.`);break;
    case 'mend':heal(st,a,ally,25,'mends');break;
    case 'rewind':heal(st,a,ally,20,'rewinds');break;
    case 'potion':{st.items.potion--;const h=Math.round(ally.maxHp*.4)+4;ally.hp=Math.min(ally.maxHp,ally.hp+h);bfx({k:'heal',a,t:ally,h});log(st,`${ally.name} drinks a potion: +${h}.`);break}
    case 'phoenix':st.items.phoenix--;ally.down=false;ally.hp=Math.ceil(ally.maxHp*.4);bfx({k:'heal',a,t:ally,h:ally.hp,rev:1});log(st,`A Phoenix Down brings ${ally.name} back.`);break;
  }
  if(!spend(st,c,'act'))return;
  if(st.enemies.every(f=>f.hp<=0)){winFight(st);return}
  advance(st);
}
function startTurn(st,i){const m=st.party[i];m.defending=false;m.taunting=false;if(m.buff&&--m.buff.rounds<0)m.buff=null}
function advance(st){
  let i=st.turn+1;
  while(i<st.party.length&&st.party[i].down)i++;
  if(i>=st.party.length){enemyPhase(st);if(st.phase!=='combat')return;i=st.party.findIndex(p=>!p.down)}
  st.turn=i;startTurn(st,i);
}
function enemyPhase(st){
  for(const f of st.enemies){
    if(f.hp<=0)continue;
    for(let k=0;k<f.attacks;k++){
      const live=st.party.filter(p=>!p.down);if(!live.length)break;
      const taunter=live.find(p=>p.taunting);
      const t=taunter||pick(live);
      if(Math.random()*100<t.dodge){log(st,`${t.name} dodges ${f.name}.`);bfx({k:'emiss',f,t,txt:'dodge'});continue}
      let dmg=rnd(f.dmg[0],f.dmg[1]);const crit=Math.random()<.05;if(crit)dmg*=1.5;
      dmg*=1-armCut(t.arm,f.lvl);if(t.defending)dmg*=1-CFG.defendCut/100;dmg=Math.max(1,Math.round(dmg));
      t.hp=Math.max(0,t.hp-dmg);log(st,`${f.name} ${crit?'crits':'hits'} ${t.name} for ${dmg}.`);bfx({k:'ehit',f,t,d:dmg,crit});
      if(t.hp===0)fall(st,t,f.tier);
    }
  }
  if(st.party.every(p=>p.down))end(st,'wipe');
}
function fall(st,m,cause){m.down=true;m.hp=0;m.defending=false;m.taunting=false;m.buff=null;m.downAt={name:st.room.name,era:st.room.era,cause};log(st,`${m.name} is down!`)}
function timeMult(st){return 1+Math.min(100,st.party.filter(p=>!p.down).reduce((a,p)=>a+(p.timePct||0),0))/100}
function winFight(st){
  let earned=0,xp=0,drops=[],cry=0;
  const L=Math.round(avgLvl(st));
  for(const f of st.enemies){
    const [lo,hi]=f.tier==='boss'?[CFG.dBossMin,CFG.dBossMax]:f.tier==='elite'?[CFG.dEliteMin,CFG.dEliteMax]:[CFG.dRegMin,CFG.dRegMax];
    earned+=rnd(lo,hi);xp+=f.xp;
    if(f.tier==='boss'){drops.push(makeItem(L+rnd(0,2),'rare'),makeItem(L+rnd(0,2),'uncommon'));cry+=rnd(2,3)}
    else if(f.tier==='elite'){drops.push(makeItem(L+rnd(0,2),'uncommon'));if(Math.random()<.5)cry+=1}
    else if(Math.random()*100<CFG.dropReg)drops.push(makeItem(L+rnd(-2,2)));
  }
  if(Math.random()*100<CFG.crystalReg)cry+=1;
  const b=partyBonus(st);earned=Math.round(earned*b*timeMult(st));xp=Math.round(xp*b);
  st.timeLeft+=earned;st.delta=earned;st.stats.earnFoes+=earned;st.crystals+=cry;
  drops.forEach(d=>st.bag.push(d));st.stats.items+=drops.length;
  if(st.fight.kind==='boss')st.bossesDone.push(st.enemies[0].bossAt);
  const ups=[];
  st.party.forEach(m=>{if(m.down)return;m.xp+=xp;let up=false;while(m.xp>=nextXp(m.lvl)){m.xp-=nextXp(m.lvl);m.lvl++;up=true}
    if(up){refresh(m);m.hp=Math.min(m.maxHp,m.hp+CLASSES[m.key].grow);ups.push(`${m.name} → Lv ${m.lvl}`);
      const sk=CLASSES[m.key].skills.find(s=>s.lvl===m.lvl);if(sk)ups.push(`${m.name} learned ${sk.name}!`)}});
  const net=earned-st.fight.spent,s=st.stats;
  if(s.best===null||net>s.best)s.best=net;if(s.worst===null||net<s.worst)s.worst=net;
  st.sum={spent:Math.round(st.fight.spent*10)/10,earned,net:Math.round(net*10)/10,xp,ups,drops,cry};
  st.party.forEach(p=>{p.defending=false;p.taunting=false;p.buff=null});
  if(M&&M.flags)M.flags.tutorialDone=true;
  st.enemies=[];st.fight=null;st.phase='summary';
}
function closeSummary(st){if(st.phase==='summary'){st.phase='room';st.roomMsg='The room is quiet now.'}}
function sacrifice(st,i){
  const m=st.party[i];if(!m||m.down||m.key==='hero')return;
  fall(st,m,'sacrifice');log(st,`${m.name} has been sacrificed (test).`);
  if(st.phase==='room')st.roomMsg=`${m.name} has fallen. If they're still down when the loop resets, they're gone.`;
  if(st.party.every(p=>p.down)){end(st,'wipe');return}
  if(st.phase==='combat'&&st.turn===i)advance(st);
}
function equip(st,mi,itemId){
  const m=st.party[mi],i=st.bag.findIndex(x=>x.id===itemId);if(i<0)return;
  const it=st.bag[i];if(it.lvl>m.lvl)return;
  st.bag.splice(i,1);if(m.gear[it.slot])st.bag.push(m.gear[it.slot]);m.gear[it.slot]=it;refresh(m);
}
function unequip(st,mi,slot){const m=st.party[mi];if(!m.gear[slot])return;st.bag.push(m.gear[slot]);delete m.gear[slot];refresh(m);if(!m.down)m.hp=Math.min(m.hp,m.maxHp)}

function applyReset(){
  const st=S,ev=[];const kind=st.result.kind;
  ev.push({type:'result',kind,survival:st.survival,target:T(st),crystals:st.crystals});
  M.crystals+=st.crystals;
  for(const m of st.party){
    const c=M.chars.find(x=>x.id===m.id);if(!c)continue;
    const kept={};for(const sl in m.gear)if(m.gear[sl].soul)kept[sl]=m.gear[sl];
    const lostGear=Object.values(m.gear).filter(it=>!it.soul).length;
    if(m.down&&m.key!=='hero'){
      // gone. The loop takes them.
      const together=M.loop-c.joinLoop+1;
      const chance=Math.min(90,CFG.returnBase+CFG.returnPerLoop*together);
      const returns=Math.random()*100<chance;
      M.fallen.push({realName:c.stranger?c.stranger.realName:c.name,key:c.key,deathLoop:M.loop,landmark:{name:m.downAt.name,era:m.downAt.era},cause:m.downAt.cause,
        returnAt:returns?M.loop+rnd(1,3):null,colour:c.colour});
      (M.memorial=M.memorial||[]).push({name:c.stranger?c.stranger.realName:c.name,cls:CLASSES[c.key].cls,loop:M.loop,colour:c.colour,recalled:false});
      M.chars=M.chars.filter(x=>x.id!==c.id);M.party=M.party.filter(id=>id!==c.id);M.lost++;
      ev.push({type:'lost',name:m.name,cls:CLASSES[m.key].cls});
      continue;
    }
    c.lvl=m.lvl;c.xp=m.xp;c.gear=kept;
    if(Object.keys(kept).length||lostGear)ev.push({type:'gear',name:m.name,kept:Object.values(kept).map(i=>i.name),lost:lostGear});
    if(c.stranger){
      c.stranger.mem+=1+(st.echoesFollowed[c.id]||0);
      if(c.stranger.mem>=c.stranger.need){
        const p=Math.min(30,1+c.stranger.deathLoop);
        ev.push({type:'recall',from:c.name,to:c.stranger.realName,p,cls:CLASSES[c.key].cls});
        (M.memorial||[]).forEach(x=>{if(x.name===c.stranger.realName)x.recalled=true});
        c.name=c.stranger.realName;c.talent=p;c.stranger=null;M.recalls++;
      }
    }
  }
  flags().firstRun=true;
  M.loop++;M.last=kind;
  // strangers drift back to the tavern
  const back=M.fallen.filter(f=>f.returnAt!==null&&f.returnAt<=M.loop);
  M.fallen=M.fallen.filter(f=>!(f.returnAt!==null&&f.returnAt<=M.loop));
  M.tavern=rollTavern();
  back.forEach(f=>{
    const r={id:uid(),key:f.key,lvl:1,stranger:{realName:f.realName,mem:0,need:Math.max(1,Math.ceil(f.deathLoop/2)),deathLoop:f.deathLoop,landmark:f.landmark,cause:f.cause},name:randName(),colour:f.colour};
    const i=M.tavern.findIndex(x=>!x.stranger&&x.key===f.key);M.tavern.splice(i>=0?i:0,i>=0?1:0,r);
    ev.push({type:'stranger',cls:CLASSES[f.key].cls});
  });
  M.tavern=M.tavern.slice(0,Math.max(3,M.tavern.filter(x=>x.stranger).length));
  M.events=ev;S=null;
}
function hire(rid,name){
  const r=M.tavern.find(x=>x.id===rid);if(!r)return;
  const cost=hireCost(r);if(M.crystals<cost)return;
  M.crystals-=cost;if(M.freeHires>0)M.freeHires--;
  const c=newChar(r.key,r.stranger?r.name:name,r.lvl,M.loop);
  if(r.stranger){c.stranger=r.stranger;c.colour=r.colour}
  M.chars.push(c);if(M.party.length<3)M.party.push(c.id);
  M.tavern=M.tavern.filter(x=>x.id!==rid);
}
function memStage(c){const s=c.stranger;if(!s)return '';const f=s.mem/s.need;
  return f===0?'A stranger. Something about them feels familiar.':f<.5?'Sometimes pauses, as if remembering something.':f<1?'Called you by name once, then looked confused.':'On the edge of remembering.'}

/* ======================= autoplay (balance testing) ======================= */
function policy(st){
  const a=st.party[st.turn],foes=st.enemies.map((f,i)=>({f,i})).filter(x=>x.f.hp>0);
  const live=st.party.map((p,i)=>({p,i})).filter(x=>!x.p.down).sort((x,y)=>x.p.hp/x.p.maxHp-y.p.hp/y.p.maxHp);
  const downed=st.party.map((p,i)=>({p,i})).filter(x=>x.p.down);
  if(downed.length&&st.items.phoenix>0)return['phoenix',downed[0].i];
  const low=live[0],lowF=low.p.hp/low.p.maxHp;
  const healer=hasSkill(a,'mend')?'mend':hasSkill(a,'rewind')&&!st.party.some(p=>!p.down&&hasSkill(p,'mend'))?'rewind':null;
  if(healer&&lowF<.45)return[healer,low.i];
  if(st.items.potion>0&&lowF<.25)return['potion',low.i];
  const big=foes.slice().sort((x,y)=>y.f.hp-x.f.hp)[0],weak=foes.slice().sort((x,y)=>x.f.hp-y.f.hp)[0];
  if(hasSkill(a,'taunt')&&foes.length>=2)return['taunt',null];
  if(hasSkill(a,'volley')&&foes.length>=2)return['volley',null];
  if(hasSkill(a,'inspire')){const t=live.find(x=>x.p.key!=='bard'&&!x.p.buff);if(t&&foes.length)return['inspire',t.i]}
  if(hasSkill(a,'firebolt')&&foes.length>=2)return['firebolt',null];
  if(window.__spam)return['attack',weak.i];
  for(const k of ['backstab','smite','firebolt','flurry'])if(hasSkill(a,k)&&(big.f.tier!=='reg'||big.f.hp>25||big.f.arm>0))return[k,big.i];
  if(hasSkill(a,'bolt')&&(big.f.tier!=='reg'||big.f.arm>0||big.f.hp>30))return['bolt',big.i];
  return['attack',weak.i];
}
function autoEquip(st){st.party.forEach((m,mi)=>{st.bag.filter(it=>it.lvl<=m.lvl).forEach(it=>{const cur=m.gear[it.slot];if(!cur||power(it.stats)>power(cur.stats))equip(st,mi,it.id)})})}
function simRun(keys,lvl,gear){
  const saveM=M,saveS=S;
  M={loop:1,crystals:0,freeHires:0,chars:[],party:[],fallen:[],tavern:[],events:[]};
  const h=newChar('hero','Sim',lvl);M.chars.push(h);
  keys.forEach(k=>{const c=newChar(k,k,lvl);M.chars.push(c);M.party.push(c.id)});
  startRun(false);let g=0;
  while(S.phase!=='end'&&g++<20000){
    if(S.phase==='room'){if(gear)autoEquip(S);chooseDoor(S,pick(Object.keys(S.room.doors)))}
    else if(S.phase==='summary')closeSummary(S);
    else{const [x,t]=policy(S);act(S,x,t)}
  }
  const r={result:S.result.kind,survival:S.survival,lvl:avgLvl(S),items:S.stats.items,earned:S.stats.earnFoes+S.stats.earnTreasure,spent:S.stats.spentAct+S.stats.spentMove};
  M=saveM;S=saveS;return r;
}
window.__sim=(n,keys,lvl,gear)=>Array.from({length:n},()=>simRun(keys,lvl||1,gear));

function renderRun(){

function roomView(){

  </section>`;
}

    <div class="foes">${foes}</div>
    <div class="rollrow"><div style="min-width:0;flex:1"><div class="log">${S.log.slice(0,6).map(l=>`<div>${esc(l)}</div>`).join('')}</div></div></div>
    <div class="turnline"><h3>${esc(a.name)}'s turn</h3><span class="small">${CLASSES[a.key].cls} · ${a.hp}/${a.maxHp} life · Tempo ${a.tempo}%${a.buff?' · inspired':''}</span></div>
    ${acts}</section>`;
}
function partyView(){
  const p=UI.pending,t=p?ACTIONS[p].target:null;
  const note=(p==='sacrifice'&&S.phase!=='combat')?`<div class="note">Test tool: tap a companion to sacrifice them.</div><button class="btn" data-a="cancel">Cancel</button>`:'';
  return note+`<section class="party" aria-label="Your party">${S.party.map((m,i)=>{
    const tgt=(t==='ally'&&!m.down)||(t==='downed'&&m.down)||(t==='sacrifice'&&!m.down&&m.key!=='hero');
    return `<button class="card ${m.down?'down':''} ${S.phase==='combat'&&i===S.turn&&!p?'active':''} ${tgt?'target':''}" data-ally="${i}" ${tgt?'':'tabindex="-1"'}>
      <span class="nm" style="color:${m.stranger||m.key==='hero'?'inherit':m.colour}">${esc(m.name)}</span><span class="sub">${CLASSES[m.key].cls} · Lv ${m.lvl}${m.taunting?' · taunting':''}${m.defending?' · bracing':''}${m.down?' · down':''}</span>
      <span class="sub">${m.hp}/${m.maxHp} life · XP ${m.xp}/${nextXp(m.lvl)}</span><span class="hp"><i style="width:${m.hp/m.maxHp*100}%"></i></span></button>`}).join('')}</section>
    <div class="small" style="text-align:center">${S.party.length===1?'Solo':S.party.length+' in party'} (×${partyBonus(S)} drops) · Crystals this run: ${S.crystals}</div>`;
}
function endView(){
  const k=S.result.kind,s=S.stats;
  const title={clear:'Run cleared',timeout:'Out of time',wipe:'Your party has fallen'}[k];
  const line={clear:'You survived to the end of the run. Time freezes as the loop snaps back.',timeout:'The last grain of time ran out. Dust. Ash. Lost in the winds.',wipe:'Screw up, it’s on you. Grab a tissue and go again.'}[k];
  const down=S.party.filter(m=>m.down&&m.key!=='hero');
  let win='';
  if(S.lock==='ready'||S.lock==='running'){
    win=`<div class="note"><div class="eyebrow">Time is frozen</div><div style="font-family:var(--mono);font-size:28px;color:var(--brass)" id="lockclock">0:${String(UI.lockLeft??30).padStart(2,'0')}</div>
      Swap your gear now. Only <b>soulbound items you're wearing</b> come with you. Everything else turns to dust.</div>
      <div class="row"><button class="btn" data-a="gear">Gear and bag (${S.bag.length})</button><button class="btn primary" data-a="lockin">Lock in early</button></div>`;
  }else{
    win=`${down.length?`<div class="note" style="border-color:var(--bad)">Still down when the loop resets: ${down.map(m=>esc(m.name)).join(', ')}. They will be lost.</div>`:''}
    <button class="btn primary" data-a="reset">Return to Aetherfall</button>`;
  }
  return `<section class="room"><div class="eyebrow">Loop ${S.loop}</div><h1 style="font-size:34px">${title}</h1><p class="desc">${line}</p>${win}
    <div class="stats">
      <span>Survived</span><span>${fmt(S.survival)} of ${fmt(T(S))}${S.quick?' (quick)':''}</span>
      <span>Rooms explored</span><span>${s.rooms}</span><span>Fights</span><span>${s.fights}</span><span>Enemies defeated</span><span>${s.kills}</span>
      <span>Items found</span><span>${s.items}</span><span>Crystals found</span><span>${S.crystals}</span>
      <span>Spent on actions</span><span>${fmt(s.spentAct)}</span><span>Spent moving</span><span>${fmt(s.spentMove)}</span>
      <span>Earned from enemies</span><span>${fmt(s.earnFoes)}</span><span>Earned from treasure</span><span>${fmt(s.earnTreasure)}</span>
      <span>Best fight</span><span>${s.best===null?'–':(s.best>=0?'+':'−')+secs(Math.abs(s.best))}</span>
      <span>Worst fight</span><span>${s.worst===null?'–':(s.worst>=0?'+':'−')+secs(Math.abs(s.worst))}</span>
      <span>Real time played</span><span>about ${Math.round(s.playMs/60000)} min</span></div></section>`;
}

/* ---------- sheets ---------- */
function renderSheet(){
  const kind=UI.sheet;let h='';
  if(kind==='summary'){
    const s=S.sum;
    h=`<div class="eyebrow">Encounter complete</div><h2>${s.net>=0?'A profitable fight':'That cost you'}</h2>
    <div class="ledger"><span>Time spent</span><span class="neg">−${secs(s.spent)}</span><span>Time shards earned</span><span class="pos">+${secs(s.earned)}</span>
    <span class="total">Net</span><span class="total ${s.net>=0?'pos':'neg'}">${s.net>=0?'+':'−'}${secs(Math.abs(s.net))}</span></div>
    <div class="small">+${s.xp} XP each${s.cry?` · +${s.cry} crystal${s.cry>1?'s':''}`:''}</div>
    ${s.ups.length?`<div class="note">${s.ups.map(esc).join('<br>')}</div>`:''}
    ${s.drops.length?`<div class="eyebrow">Loot</div>${s.drops.map(itemCard).join('')}`:''}
    <button class="btn primary" data-a="continue">Continue</button>`;
  }else if(kind==='gear')h=gearSheet();
  else if(kind==='tune')h=tuneSheet();
  else if(kind==='settings')h=settingsSheet();
  else if(kind==='howto')h=howtoSheet();
  else if(kind==='review')h=reviewSheet();
  else if(kind==='newconfirm')h=`<h2>Start a new game?</h2><p class="desc">This deletes your hero, companions, crystals and loops on this device, and starts again from loop 1.</p>
    <div class="row"><button class="btn" data-a="close">Keep my save</button><button class="btn primary" data-a="newyes">Start again</button></div>`;
  else if(kind==='hire')h=hireSheet();
  else if(kind==='events')h=eventsSheet();
  else if(kind==='abandon')h=`<h2>Abandon this run?</h2><p class="desc">It counts as running out of time: anyone who's down is lost, and only equipped soulbound gear is kept.</p>
    <div class="row"><button class="btn" data-a="close">Keep playing</button><button class="btn primary" data-a="abandonyes">Abandon</button></div>`;
  else if(['wizard','tavern','party','gate','memorial','shop'].includes(kind))h=placeSheet(kind);
  else if(kind==='wipe')h=`<h2>Reset all progress?</h2><p class="desc">This deletes your hero, companions, crystals and loops on this device.</p>
    <div class="row"><button class="btn" data-a="settings">Back</button><button class="btn primary" data-a="wipeyes">Delete everything</button></div>`;
  sheet.hidden=false;sheet.innerHTML=`<div role="dialog">${h}</div>`;
}
function itemCard(it,extra){return `<div class="item ${it.soul?'soul':''}"><span class="nm r-${it.rarity}">${esc(it.name)}</span>
  <span class="st">${R_NAME[it.rarity]} ${SLOT_NAME[it.slot].toLowerCase()} · Lv ${it.lvl}${it.soul?' · <span class="sb">Soulbound</span>':''}</span><span class="st">${statLine(it.stats)}</span>${extra||''}</div>`}
function deltaLine(a,b){const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  const parts=STAT_ORDER.filter(k=>keys.has(k)).map(k=>{const d=(a[k]||0)-((b||{})[k]||0);return d?`<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d)} ${STAT_LABEL[k].replace('% ','% ')}</span>`:''}).filter(Boolean);
  return parts.length?parts.join(' '):'<span class="small">Same stats</span>'}
function gearSheet(){
  const inRun=!!S,party=inRun?S.party:[hero()].concat(M.party.map(id=>M.chars.find(c=>c.id===id)).filter(Boolean));
  const editable=inRun&&(S.phase==='room'||(S.phase==='end'&&(S.lock==='ready'||S.lock==='running')));
  UI.gearChar=Math.min(UI.gearChar,party.length-1);
  const m=party[UI.gearChar];
  const tabs=party.map((c,i)=>`<button class="btn ${i===UI.gearChar?'on':''}" data-gc="${i}">${esc(c.name)}</button>`).join('');
  const slots=SLOTS.map(sl=>{const it=m.gear[sl];return `<button class="card slot ${UI.gearSlot===sl?'sel':''} ${it&&it.soul?'item soul':''}" data-gs="${sl}">
    <span class="lab">${SLOT_NAME[sl]}</span>${it?`<span class="nm r-${it.rarity}" style="font-size:14px">${esc(it.name)}</span><span class="st" style="font-family:var(--mono);font-size:11px;color:var(--dim)">${statLine(it.stats)}${it.soul?' · ◆':''}</span>`:'<span class="small">Empty</span>'}</button>`}).join('');
  let detail='';
  if(UI.gearSlot){
    const cur=m.gear[UI.gearSlot];
    const opts=inRun?S.bag.filter(i=>i.slot===UI.gearSlot).sort((a,b)=>power(b.stats)-power(a.stats)):[];
    detail=`<div class="eyebrow">${SLOT_NAME[UI.gearSlot]}${inRun?` · ${opts.length} in your bag`:''}</div>
      ${cur&&editable?`<button class="btn" data-uneq="${UI.gearSlot}">Unequip ${esc(cur.name)}</button>`:''}
      ${opts.map(it=>itemCard(it,`<div class="small">${deltaLine(it.stats,cur&&cur.stats)}</div>${editable?(it.lvl>m.lvl?`<span class="small down">Needs Lv ${it.lvl}</span>`:`<button class="btn" data-eq="${it.id}" style="min-height:40px">Equip</button>`):''}`)).join('')||(inRun?'<span class="small">Nothing in your bag for this slot.</span>':'')}`;
  }
  const s=calc(m,m.gear);
  return `<div class="eyebrow">Gear${inRun?'':' · in town you can only look'}</div><h2>${esc(m.name)}</h2>
    <div class="tabs">${tabs}</div>
    <div class="small">${CLASSES[m.key].cls} · Lv ${m.lvl} · ${s.maxHp} life · Damage ${s.dmgMin}–${s.dmgMax}${s.dmgPct?` (+${s.dmgPct}%)`:''} · Armour ${s.arm} · Crit ${s.critC}% ×${s.critD/100}${s.dodge?` · Dodge ${s.dodge}%`:''} · Tempo ${s.tempo}%${s.timePct?` · +${s.timePct}% time`:''}</div>
    <div class="slots">${slots}</div>${detail}
    ${inRun&&!editable?'<div class="note">You can only change gear between rooms, not mid-fight.</div>':''}
    <p class="small">◆ glowing items are soulbound. At the reset, only soulbound items you're wearing are kept.</p>
    <button class="btn primary" data-a="close">Done</button>`;
}
function hireSheet(){
  const r=M.tavern.find(x=>x.id===UI.hireId);if(!r)return '<button class="btn" data-a="close">Close</button>';
  if(r.stranger)return `<div class="eyebrow">The tavern</div><h2>${esc(r.name)}</h2><p class="desc">A ${CLASSES[r.key].cls.toLowerCase()} you don't know. They introduce themselves with a nod. Something about the way they stand feels familiar.</p>
    <div class="row"><button class="btn" data-a="close">Not now</button><button class="btn primary" data-a="hireyes">Hire ${esc(r.name)}</button></div>`;
  return `<div class="eyebrow">The tavern · ${CLASSES[r.key].cls}, Lv ${r.lvl}</div><h2>Name your companion</h2>
    <div class="wizard"><span class="eyebrow">The ${CLASSES[r.key].cls.toLowerCase()}</span><q>${esc(HIRE_LINES[r.key])}</q></div>
    <p class="desc">Give them a name. You'll want to remember it.</p>
    <label class="field"><span class="small">First name</span><span class="inline"><input id="hfirst" value="${esc(UI.hireFirst)}" maxlength="14" autocomplete="off"><button class="btn" data-a="rfirst">Random</button></span></label>
    <label class="field"><span class="small">Surname</span><span class="inline"><input id="hsur" value="${esc(UI.hireSur)}" maxlength="16" autocomplete="off"><button class="btn" data-a="rsur">Random</button></span></label>
    <div class="row"><button class="btn" data-a="close">Not now</button><button class="btn primary" data-a="hireyes">Hire</button></div>`;
}
function eventsSheet(){
  const ev=M.events||[];
  const parts=ev.map(e=>{
    if(e.type==='intro')return `<div class="note">You wake in a quiet hamlet that time forgot. You remember everything. Nobody else does.</div>`;
    if(e.type==='result')return `<div><div class="eyebrow">The loop resets</div><h2>${{clear:'Run cleared',timeout:'Out of time',wipe:'Party wiped'}[e.kind]}</h2><div class="small">Survived ${fmt(e.survival)} of ${fmt(e.target)}${e.crystals?` · brought back ${e.crystals} crystal${e.crystals>1?'s':''}`:''}</div></div>`;
    if(e.type==='lost')return `<div class="note" style="border-color:var(--bad)"><b>${esc(e.name)}</b> the ${e.cls.toLowerCase()} is gone. The loop took them.</div>`;
    if(e.type==='gear')return `<div class="small"><b>${esc(e.name)}</b>: ${e.kept.length?'kept '+e.kept.map(esc).join(', '):'kept nothing'}${e.lost?`; ${e.lost} item${e.lost>1?'s':''} turned to dust`:''}.</div>`;
    if(e.type==='stranger')return `<div class="note">There's a new ${e.cls.toLowerCase()} at the tavern. They look... familiar.</div>`;
    if(e.type==='recall')return `<div class="namefade"><span class="eyebrow">A memory returns</span><span class="old">${esc(e.from)}</span><span class="new">${esc(e.to)}</span>
      <q class="desc" style="text-align:center">...that's my name. You gave me that name.</q><span class="small">Talent unlocked: +${e.p}% max HP and +${e.p}% time from drops.</span></div>`;
    return '';
  }).join('');
  return `<div class="events">${parts}</div><button class="btn primary" data-a="eventsok">Continue</button>`;
}
function tuneSheet(){
  return `<div class="eyebrow">Tuning</div><h2>Change the numbers</h2>
    <p class="desc">Changes apply straight away and are remembered on this device.</p>
    <form class="tune" id="tuneform">${TUNE.map(([g,rows])=>`<fieldset><legend>${g}</legend>${rows.map(([k,l])=>`<label for="t-${k}"><span>${l}</span><input id="t-${k}" name="${k}" type="number" step="any" min="0" value="${CFG[k]}"></label>`).join('')}</fieldset>`).join('')}</form>
    ${M?`<fieldset class="tune" style="border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px"><legend style="color:var(--brass);font-size:13px;text-transform:uppercase;letter-spacing:.1em">Test tools</legend>
      <button class="btn" data-a="givecry">Add 5 crystals</button><button class="btn" data-a="wipe">Reset all progress</button></fieldset>`:''}
    <div class="row"><button class="btn" data-a="tunereset">Reset numbers</button><button class="btn primary" data-a="close">Done</button></div>`;
}

let lockTimer=null;
function startLock(){
  S.lock='running';UI.lockLeft=30;clearInterval(lockTimer);
  lockTimer=setInterval(()=>{UI.lockLeft--;const el=document.getElementById('lockclock');if(el)el.textContent='0:'+String(Math.max(0,UI.lockLeft)).padStart(2,'0');
    if(UI.lockLeft<=0){clearInterval(lockTimer);S.lock='done';UI.sheet=null;save();render()}},1000);
}

/* ---------- input ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-place]');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.place){UI.sheet=d.place==='cottage'?'gear':d.place;UI.gearSlot=null;if(d.place==='wizard')UI.wizN=null;render();if(d.place==='tavern'){flags().keeperMet=true;save()}return}
  if(d.wiz){if(d.wiz==='leave'){UI.sheet=null;UI.wizN=null}else UI.wizN=wizNode(d.wiz);save();render();return}
  if(d.a==='inspect'){const r=S.room,I=INSPECT[r.name];if(I){const lines=r.insp?I.again:I.first;r.insp++;S.roomMsg=lines.join(' ');if(I.flag)flags()[I.flag]=true;save();render()}return}
  if(d.g){UI.gender=d.g;if(['Lorrance','Lorraine',''].includes(UI.heroName))UI.heroName=d.g==='f'?'Lorraine':'Lorrance';render();return}
  if(d.q){UI.quick=d.q==='1';render();return}
  if(d.pick){const i=M.party.indexOf(d.pick);if(i>=0)M.party.splice(i,1);else if(M.party.length<3)M.party.push(d.pick);save();render();return}
  if(d.hire){UI.hireId=d.hire;UI.hireFirst=randFirst();UI.hireSur=randSur();UI.sheet='hire';render();return}
  if(d.set){const[k,v]=d.set.split(':');SET[k]=v==='true'?true:v==='false'?false:v;saveSet();if(k==='sound'&&SET.sound)SFX.buff();render();return}
  if(d.star){UI.rvStars=+d.star;render();return}
  if(d.door){S.delta=0;SFX.door();chooseDoor(S,d.door);after();return}
  if(d.act){const A=ACTIONS[d.act];S.delta=0;if(A.target==='none'){act(S,d.act,null);after()}else{UI.pending=d.act;render()}return}
  if(d.foe!=null&&UI.pending&&ACTIONS[UI.pending].target==='enemy'){const x=UI.pending;UI.pending=null;act(S,x,+d.foe);after();return}
  if(d.ally!=null&&UI.pending==='sacrifice'){UI.pending=null;sacrifice(S,+d.ally);after();return}
  if(d.ally!=null&&UI.pending&&['ally','downed'].includes(ACTIONS[UI.pending].target)){const x=UI.pending;UI.pending=null;act(S,x,+d.ally);after();return}
  if(d.gc!=null){UI.gearChar=+d.gc;UI.gearSlot=null;render();return}
  if(d.gs){UI.gearSlot=UI.gearSlot===d.gs?null:d.gs;render();return}
  if(d.eq){equip(S,UI.gearChar,d.eq);save();render();return}
  if(d.uneq){unequip(S,UI.gearChar,d.uneq);save();render();return}
  switch(d.a){
    case 'menu':UI.menu=true;UI.sheet=null;UI.pending=null;save();render();break;
    case 'continue-game':UI.menu=false;UI.sheet=null;if(S)S.lastTick=Date.now();render();break;
    case 'newgame-ask':UI.sheet='newconfirm';render();break;
    case 'newyes':clearInterval(lockTimer);M=null;S=null;store.del('t2r-meta2');store.del('t2r-run2');UI.sheet=null;UI.menu=true;render();break;
    case 'howto':UI.sheet='howto';render();break;
    case 'settings':UI.sheet='settings';render();break;
    case 'review':UI.sheet='review';UI.rvDone=false;UI.rvErr=null;render();break;
    case 'rvsend':{if(UI.rvSending||!UI.rvStars)break;const r={rating:UI.rvStars,liked:(UI.rvLiked||'').trim(),change:(UI.rvChange||'').trim(),name:(UI.rvName??(store.get('t2r-rv-name')||'')).trim()};
      store.set('t2r-rv-name',r.name);UI.rvSending=true;UI.rvErr=null;render();
      sendReview(r).then(()=>{UI.rvSending=false;UI.rvDone=true;UI.rvLiked='';UI.rvChange='';render()},()=>{UI.rvSending=false;UI.rvErr=reviewFormUrl(r);render()});break}
    case 'newgame':{const n=(document.getElementById('heroname').value||'').trim()||(UI.gender==='f'?'Lorraine':'Lorrance');UI.menu=false;newGame(n);flags();UI.eventsSeen=false;UI.intro=true;save();render();clearTimeout(UI.introT);UI.introT=setTimeout(()=>{UI.intro=false;render()},2600);break}
    case 'skipintro':clearTimeout(UI.introT);UI.intro=false;render();break;
    case 'enter':UI.sheet=null;startRun(UI.quick);UI.eventsSeen=true;M.events=[];save();render();break;
    case 'continue':S.delta=0;UI.sheet=null;closeSummary(S);after();break;
    case 'cancel':UI.pending=null;render();break;
    case 'sacrifice':UI.pending='sacrifice';render();break;
    case 'gear':UI.sheet='gear';UI.gearSlot=null;render();break;
    case 'close':UI.sheet=null;render();break;
    case 'tune':UI.sheet='tune';render();break;
    case 'tunereset':CFG=Object.assign({},DEFAULTS);store.set('t2r-tune2',CFG);render();break;
    case 'givecry':M.crystals+=5;save();render();break;
    case 'wipe':UI.sheet='wipe';render();break;
    case 'wipeyes':UI.menu=true;M=null;S=null;store.del('t2r-meta2');store.del('t2r-run2');UI.sheet=null;render();break;
    case 'abandon':UI.sheet='abandon';render();break;
    case 'abandonyes':UI.sheet=null;end(S,'timeout');S.lock='none';after();break;
    case 'lockin':clearInterval(lockTimer);S.lock='done';UI.sheet=null;save();render();break;
    case 'reset':clearInterval(lockTimer);applyReset();UI.eventsSeen=false;UI.sheet='events';UI.wiz=null;save();render();break;
    case 'eventsok':UI.eventsSeen=true;UI.sheet=null;M.events=[];save();render();break;
    case 'rfirst':UI.hireFirst=randFirst();render();break;
    case 'rsur':UI.hireSur=randSur();render();break;
    case 'hireyes':{const r=M.tavern.find(x=>x.id===UI.hireId);if(!r){UI.sheet=null;render();break}
      const name=r.stranger?r.name:(((UI.hireFirst||'').trim()||randFirst())+' '+((UI.hireSur||'').trim()||randSur()));
      hire(UI.hireId,name);UI.sheet='tavern';save();render();break}
  }
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('g[data-place]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='heroname'){UI.heroName=t.value;return}
  if(t.id==='hfirst'){UI.hireFirst=t.value;return}
  if(t.id==='hsur'){UI.hireSur=t.value;return}
  if(t.id==='rvLiked'){UI.rvLiked=t.value;return}
  if(t.id==='rvChange'){UI.rvChange=t.value;return}
  if(t.id==='rvName'){UI.rvName=t.value;return}
  if(t.closest('#tuneform')){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){CFG[t.name]=v;store.set('t2r-tune2',CFG)}}
});
function after(){
  if(S&&S.phase==='end'&&S.lock==='ready')startLock();
  if(S&&S.phase==='end'&&UI.sheet==='summary')UI.sheet=null;
  save();render();
}

function boot(data){
  applySet();
  if(data&&data.M!==undefined){M=data.M;S=data.S}
  else{M=store.get('t2r-meta2');S=store.get('t2r-run2');migrateAll(M);migrateAll(S);if(S&&S.party)S.party.forEach(refresh)}
  if(M){flags();if(M.loop>1)M.flags.firstRun=true}
  if(S){S.lastTick=Date.now();if(S.phase==='end'&&S.lock==='running')S.lock='done'}
  if(M&&M.events&&M.events.length&&!S){UI.eventsSeen=false}else UI.eventsSeen=true;
  render();
}
window.kgBuild=GAME_VERSION;window.kgBeforeUpdate=()=>{try{save()}catch(_){}};
window.claude?.hot?.snapshot?.(()=>({M,S}));
requestAnimationFrame(battleLoop);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

<!-- Kralnu Games install kit: Install button, Android/desktop prompt and iPhone instructions -->
<style id="kg-install-style">
html:not(.kg-can-install) [data-install]{display:none!important}
.kg-sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483000;width:min(420px,calc(100% - 24px));background:#211e2b;color:#ece3cc;border:2px solid #3a3547;border-radius:16px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);font:15px/1.45 'Alegreya Sans',system-ui,sans-serif;display:grid;gap:10px;text-align:left}
.kg-sheet b{font-size:17px}
.kg-sheet p{margin:0}
.kg-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kg-row button{font:inherit;font-weight:700;border-radius:999px;padding:9px 16px;cursor:pointer;border:2px solid #3a3547;background:transparent;color:inherit}
.kg-row .kg-yes{background:#e0ae52;border-color:#e0ae52;color:#1d1606}
.kg-row button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
</style>
<script id="kg-install">
(function(){
  var NAME='30× to Remember',KEY='tr-install-snooze',AUTO=0;
  var evt=null,sheet=null,root=document.documentElement;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function standalone(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}
  function can(){return !standalone()&&(!!evt||ios)}
  function sync(){root.classList.toggle('kg-can-install',can())}
  function snoozed(){try{return Date.now()<(+localStorage.getItem(KEY)||0)}catch(e){return false}}
  function snooze(days){try{localStorage.setItem(KEY,String(Date.now()+days*864e5))}catch(e){}}
  function close(){if(sheet){sheet.remove();sheet=null}}
  function show(auto){close();var iosHelp=!evt&&ios;sheet=document.createElement('div');sheet.className='kg-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','Install '+NAME);
    sheet.innerHTML='<b>Install '+NAME+'?</b><p>'+(iosHelp?'In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It then opens full screen and works offline.':'Put it on your home screen and play full screen like a proper app, even without a signal.')+'</p><div class="kg-row"><button type="button" class="kg-no">'+(iosHelp?'Got it':'Not now')+'</button>'+(iosHelp?'':'<button type="button" class="kg-yes">Install</button>')+'</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('.kg-no').onclick=function(){snooze(auto?3:1);close()};
    var y=sheet.querySelector('.kg-yes');if(y){y.onclick=install;y.focus()}}
  function install(){close();var e=evt;evt=null;if(!e){sync();return}e.prompt();Promise.resolve(e.userChoice).then(sync,sync)}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;sync();if(AUTO&&!snoozed())setTimeout(function(){if(evt&&!sheet&&!standalone())show(true)},AUTO)});
  addEventListener('appinstalled',function(){evt=null;sync();close()});
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-install]');if(!b)return;e.preventDefault();e.stopPropagation();if(evt)install();else if(ios)show(false)},true);
  sync();
  window.KralnuInstall={can:can,open:function(){show(false)}};
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>

<style id="kg-update-style">
.kg-upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 24px));transition:transform .35s ease;z-index:2147483001;width:min(440px,calc(100% - 20px));box-sizing:border-box;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#211e2b;color:#ece3cc;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4);font:600 14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left;letter-spacing:0;text-transform:none}
.kg-upd.on{transform:translate(-50%,0)}
.kg-upd span{flex:1 1 160px}
.kg-upd button{font:inherit;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;white-space:nowrap;width:auto;margin:0}
.kg-upd .kg-go{background:#e0ae52;border-color:#e0ae52;color:#1d1606}
.kg-upd button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.kg-upd{transition:none}}
</style>
<script id="kg-update">
// Kralnu Games update check. When you push an update, change the game's version
// AND version.json to the same new value; players then get a "new version" notice.
(function(){
  var NAME="30× to Remember",BUILD="0.2.0",CACHES=["tr-"],CHECK=true;
  var path=location.pathname,dir=path.replace(/[^/]*$/,''),last=0,bar=null,busy=false;
  if(/^\?v=\d+$/.test(location.search)){try{history.replaceState(history.state,'',path+location.hash)}catch(e){}}
  function build(){return String(window.kgBuild!=null?window.kgBuild:BUILD)}
  function skipped(v){try{return sessionStorage.getItem('kg-upd-skip')===v}catch(e){return false}}
  function hide(){if(!bar)return;var b=bar;bar=null;b.classList.remove('on');setTimeout(function(){b.remove()},400)}
  function note(html,buttons){hide();bar=document.createElement('div');bar.className='kg-upd';bar.setAttribute('role','status');
    bar.innerHTML='<span>'+html+'</span>'+buttons;document.body.appendChild(bar);
    var b=bar;requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})});return b}
  function latest(){return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function now(){if(busy)return;busy=true;
    // Only clear the offline copy once we know the newest version can be downloaded.
    latest().then(function(){
      try{window.kgBeforeUpdate&&window.kgBeforeUpdate()}catch(e){}
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+dir)===0}).map(function(r){return r.unregister()}))}))}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return CACHES.some(function(p){return k.indexOf(p)===0})}).map(function(k){return caches.delete(k)}))}))}catch(e){}
      var done=false,go=function(){if(done)return;done=true;location.replace(path+'?v='+Date.now())};
      Promise.all(jobs).then(go,go);setTimeout(go,3000);
    },function(){busy=false;
      var b=note('No connection right now. Get online, then try again.','<button type="button" class="kg-later">OK</button>');
      b.querySelector('.kg-later').onclick=hide;setTimeout(function(){if(bar===b)hide()},6000);
    });
  }
  function show(v){if(bar||skipped(v))return;
    var b=note('A new version of '+NAME+' is ready.','<button type="button" class="kg-later">Later</button><button type="button" class="kg-go">Update</button>');
    b.querySelector('.kg-go').onclick=now;
    b.querySelector('.kg-later').onclick=function(){try{sessionStorage.setItem('kg-upd-skip',v)}catch(e){}hide()};
  }
  function check(force){if(!CHECK)return;var t=Date.now();if(!force&&t-last<6e5)return;last=t;
    latest().then(function(j){if(j&&j.version!=null&&String(j.version)!==build())show(String(j.version))}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-get-latest]');if(!b)return;e.preventDefault();e.stopPropagation();now()},true);
  addEventListener('load',function(){setTimeout(function(){check(true)},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  setInterval(function(){if(!document.hidden)check(false)},18e5);
  window.KralnuUpdate={now:now,check:function(){check(true)},build:build};
})();
</script>
</body>
</html>
