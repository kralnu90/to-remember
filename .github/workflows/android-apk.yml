name: Build Android APK

# Builds the APK and publishes it as the "Android app" release, so the newest one is always at
# https://github.com/kralnu90/to-remember/releases/latest/download/30x-to-remember.apk
# The app loads the live game, so you only need a new APK when the android/ shell itself changes.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          android/build.sh "${{ github.run_number }}" "$VERSION" "$PWD/out/30x-to-remember.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app out/30x-to-remember.apk \
            --title "30× to Remember for Android (build ${{ github.run_number }})" \
            --notes "Download 30x-to-remember.apk on your phone and open it to install (allow installs from your browser if Android asks). The app plays the live game, so game updates arrive by themselves; it needs a signal the first time, then works offline." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: 30x-to-remember-apk
          path: out/30x-to-remember.apk
